<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト｜完成</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fffdfa;--panel:#fbf7f2;--ink:#2f2722;--brown:#9f7654;--brown-dark:#7d5d44;--brown-light:#b58b68;--muted:#8c827a;--line:#e7ddd4;--success:#eaf3eb;--success-ink:#59745e}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 64px}
.complete-header{display:flex;align-items:flex-end;gap:10px;margin-bottom:28px}.complete-brand{font-size:30px;font-weight:900;letter-spacing:.08em;color:var(--brown-dark);line-height:1}.complete-tag{font-size:13px;font-weight:700;color:var(--brown-dark);padding-bottom:3px}
.progress{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 70px 38px}.progress::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:4px;background:#eee9e5;border-radius:999px;z-index:0}.progress-step{position:relative;z-index:1;text-align:center;color:#6f635a}.progress-dot{width:46px;height:46px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;background:#f0ece8;color:#72665d;font-size:16px}.progress-step.current .progress-dot{background:var(--brown-light);color:#fff}.progress-label{font-size:15px;font-weight:800}.progress-step.current .progress-label{color:var(--brown-dark)}
.card{max-width:760px;margin:0 auto;background:linear-gradient(135deg,#fcf9f5,#fffdfb);border:1px solid #eee5dd;border-radius:22px;padding:30px 28px;box-shadow:0 10px 28px rgba(109,77,51,.04)}.hero{text-align:center}.hero .brand{font-size:20px;font-weight:900;letter-spacing:.08em;color:var(--brown-dark);margin-bottom:18px}.icon{width:92px;height:92px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#b58b68,#9f7654);color:#fff;font-size:46px;font-weight:800;box-shadow:0 10px 26px rgba(132,92,59,.14)}.title{font-size:34px;line-height:1.3;margin:0;color:var(--ink)}.lead{font-size:15px;line-height:1.8;color:#75695f;margin:14px auto 0;max-width:560px}.status{max-width:560px;margin:22px auto 0;padding:14px 16px;border-radius:14px;background:var(--success);color:var(--success-ink);font-weight:800;font-size:15px;text-align:center}.status.err{background:#f8e8e6;color:#9c4c45}
.summary{max-width:620px;margin:28px auto 0;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--line)}.label{font-size:13px;color:#8b7d70}.value{font-size:18px;font-weight:800;color:#4d443d;text-align:right}.purchase-id{font-size:16px;letter-spacing:.03em}.btns{max-width:620px;margin:28px auto 0}.btn{min-height:58px;padding:15px 18px;border-radius:14px;text-decoration:none;font-size:16px;font-weight:900;text-align:center;display:grid;place-items:center}.btn.primary{color:#fff;background:linear-gradient(180deg,#a77d5a,#956c4c);box-shadow:0 7px 18px rgba(128,87,54,.15)}.note{max-width:620px;margin:18px auto 0;text-align:center;color:#8a7d72;font-size:12px;line-height:1.7}
@media(max-width:760px){.wrap{padding:18px 14px 48px}.complete-header{margin-bottom:22px;align-items:center}.complete-brand{font-size:25px}.complete-tag{font-size:11px;padding-bottom:0}.progress{margin:0 6px 28px}.progress::before{top:18px;height:3px}.progress-dot{width:38px;height:38px;margin-bottom:7px;font-size:14px}.progress-label{font-size:11px}.card{padding:24px 18px;border-radius:18px}.hero .brand{font-size:18px}.icon{width:78px;height:78px;font-size:38px}.title{font-size:28px}.lead{font-size:14px}.status{font-size:14px}.row{grid-template-columns:110px 1fr;padding:18px 4px}.value{font-size:16px}.purchase-id{font-size:14px}}
@media(max-width:390px){.complete-tag{display:none}.progress-label{font-size:10px}.row{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="complete-header"><div class="complete-brand">コエフォト</div><div class="complete-tag">写真と声で、想いを届ける</div></header>
<nav class="progress" aria-label="作成の進捗"><div class="progress-step"><div class="progress-dot">1</div><div class="progress-label">入力</div></div><div class="progress-step"><div class="progress-dot">2</div><div class="progress-label">プレビュー</div></div><div class="progress-step"><div class="progress-dot">3</div><div class="progress-label">購入確認</div></div><div class="progress-step current"><div class="progress-dot">4</div><div class="progress-label">完成</div></div></nav>
<section class="card"><div class="hero"><div class="icon" id="icon">…</div><h1 class="title" id="title">決済を確認しています</h1><p class="lead" id="lead">Stripeからの決済完了通知を確認しています。</p><div class="status" id="status">確認中…</div></div>
<div class="summary" id="summary" hidden><div class="row"><div class="label">購入ID</div><div class="value purchase-id" id="purchaseId">—</div></div><div class="row"><div class="label">購入金額</div><div class="value">480円（税込）</div></div><div class="row"><div class="label">閲覧・ダウンロード期限</div><div class="value" id="expiresAt">—</div></div></div>
<div class="btns" id="actions" hidden><a class="btn primary" id="openCard" href="#">完成版を開く →</a></div><p class="note">購入IDはお問い合わせ時の確認番号としてご利用ください。完成版では、贈るカードとQRから見るページをご確認いただけます。</p></section>
</main>

<script>
const SUPABASE_URL='https://qbutohdqtgzjejnwdqcx.supabase.co';
const STATUS_URL=SUPABASE_URL+'/functions/v1/payment-status-v2';

const qs=new URLSearchParams(location.search);
const sessionId=qs.get('session_id')||'';
const publicId=qs.get('public_id')||'';

const icon=document.getElementById('icon');
const title=document.getElementById('title');
const lead=document.getElementById('lead');
const status=document.getElementById('status');
const actions=document.getElementById('actions');
const summary=document.getElementById('summary');
const purchaseIdEl=document.getElementById('purchaseId');
const expiresAtEl=document.getElementById('expiresAt');
const openCard=document.getElementById('openCard');

function fail(msg){
  icon.textContent='!';
  title.textContent='確認できませんでした';
  lead.textContent='決済状況を確認できませんでした。';
  status.className='status err';
  status.textContent=msg;
  actions.hidden=true;
  summary.hidden=true;
}

function formatDate(v){
  const d=v?new Date(v):null;
  if(!d || isNaN(d))return '—';
  return new Intl.DateTimeFormat('ja-JP',{
    year:'numeric',month:'long',day:'numeric'
  }).format(d);
}

async function check(){
  if(!sessionId.startsWith('cs_')||!/^[0-9a-f-]{36}$/i.test(publicId)){
    fail('決済情報が不足しています。');
    return;
  }

  for(let i=0;i<15;i++){
    try{
      const r=await fetch(STATUS_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          session_id:sessionId,
          public_id:publicId
        })
      });

      const d=await r.json().catch(()=>({}));

      if(r.ok&&d.ok&&d.paid){
        const finalUrl='finished.html?session_id='+encodeURIComponent(sessionId)
          +'&public_id='+encodeURIComponent(publicId);

        icon.textContent='✓';
        title.textContent='完成しました';
        lead.textContent='決済が完了しました。贈るカードとQRから見るページをご利用いただけます。';
        status.className='status ok';
        status.textContent='ご購入ありがとうございます';

        purchaseIdEl.textContent=d.purchase_id||'—';
        expiresAtEl.textContent=formatDate(d.expires_at);
        openCard.href=finalUrl;

        summary.hidden=false;
        actions.hidden=false;

        sessionStorage.setItem('koephoto-purchase-draft',JSON.stringify({
          public_id:publicId,
          purchase_id:d.purchase_id||null,
          status:'paid',
          session_id:sessionId,
          expires_at:d.expires_at||null
        }));
        return;
      }

      if(r.status===404){
        fail('この決済情報に対応するコエフォトが見つかりません。');
        return;
      }

      status.textContent='決済完了通知を待っています… ('+(i+1)+'/15)';
    }catch(e){
      status.textContent='通信を再確認しています… ('+(i+1)+'/15)';
    }

    await new Promise(r=>setTimeout(r,1000));
  }

  fail('決済の反映に時間がかかっています。少し待ってから再読み込みしてください。');
}

check();
</script>
</body>
</html>
