<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト｜完成</title>
<style>
:root{
  --bg:#f5f1ea;
  --ink:#4e4339;
  --muted:#8a7d70;
  --line:#ded4c7;
  --accent:#a98a6b;
  --panel:#fffdf9;
  --okbg:#f0f6ef;
  --ok:#4e6b4f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.wrap{max-width:760px;margin:0 auto;padding:26px 20px 54px}
.flow{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin-bottom:22px;font-size:11px;color:#a49a90;white-space:nowrap
}
.flow .current{position:relative;color:var(--ink);font-weight:700}
.flow .current::after{
  content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;
  border-radius:999px;background:#b69570
}
.arrow{color:#c3b9ae}
.card{
  background:rgba(255,253,249,.9);
  border:1px solid #e2d8cc;
  border-radius:24px;
  padding:28px 22px 24px;
}
.brand{text-align:center;font-size:14px;font-weight:700;letter-spacing:.08em;color:#76695d}
.icon{
  width:58px;height:58px;border-radius:50%;margin:18px auto 12px;
  display:grid;place-items:center;background:#eee7de;font-size:30px;font-weight:700
}
.title{text-align:center;font-size:25px;margin:0 0 8px}
.lead{text-align:center;font-size:14px;line-height:1.75;color:#75695e;margin:0 auto;max-width:480px}
.status{
  margin:22px auto 0;padding:15px 16px;border-radius:16px;background:#f0ebe4;
  text-align:center;font-size:14px;line-height:1.7;max-width:520px
}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.err{background:#fff0ee;color:#95493f}
.summary{
  display:grid;gap:0;margin:22px auto 0;max-width:520px;
  border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff
}
.row{
  display:grid;grid-template-columns:120px 1fr;gap:12px;
  padding:13px 15px;border-bottom:1px solid #eee6dd;font-size:13px;line-height:1.55
}
.row:last-child{border-bottom:0}
.label{color:#918579}
.value{font-weight:650;word-break:break-all}
.btns{display:grid;gap:10px;margin:22px auto 0;max-width:520px}
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;border:0;
  border-radius:15px;padding:15px 16px;font-weight:750;font-size:15px;cursor:pointer
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#fff;color:var(--ink);border:1px solid #cdbca9}
.note{text-align:center;color:#8a7d70;font-size:11px;line-height:1.75;margin:17px auto 0;max-width:520px}
[hidden]{display:none!important}
@media(max-width:420px){
  .wrap{padding-left:16px;padding-right:16px}
  .flow{gap:7px;font-size:10.5px}
  .row{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="flow">
    <span>1 入力</span><span class="arrow">→</span>
    <span>2 プレビュー</span><span class="arrow">→</span>
    <span>3 購入確認</span><span class="arrow">→</span>
    <span class="current">4 完成</span>
  </div>

  <section class="card">
    <div class="brand">コエフォト</div>
    <div class="icon" id="icon">…</div>
    <h1 class="title" id="title">決済を確認しています</h1>
    <p class="lead" id="lead">Stripeからの決済完了通知を確認しています。数秒かかることがあります。</p>

    <div class="status" id="status">確認中…</div>

    <div class="summary" id="summary" hidden>
      <div class="row"><div class="label">購入ID</div><div class="value" id="purchaseId">—</div></div>
      <div class="row"><div class="label">購入金額</div><div class="value">480円（税込）</div></div>
      <div class="row"><div class="label">閲覧期限</div><div class="value" id="expiresAt">—</div></div>
    </div>

      <div class="qr-note">このQRコードをメッセージカードに使用します。生成AIではなく、実際のボイスページURLからプログラムで生成しています。</div>
      <canvas id="qrCanvas" width="188" height="188" aria-label="受け取り用QRコード"></canvas>
    </div>

    <div class="btns" id="actions" hidden>
      <a class="btn primary" id="openCard" href="#">完成版を開く</a>
    </div>

    <p class="note">購入IDはお問い合わせ時の確認番号としてご利用ください。完成版を開いた次の画面で、贈るカードやQRコードの保存、新しいコエフォトの作成へ進めます。</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const SUPABASE_URL='https://qbutohdqtgzjejnwdqcx.supabase.co';
const STATUS_URL=SUPABASE_URL+'/functions/v1/payment-status-v2';

const qs=new URLSearchParams(location.search);
const sessionId=qs.get('session_id')||'';
const publicId=qs.get('public_id')||'';

const icon=document.getElementById('icon');
const title=document.getElementById('title');
const lead=document.getElementById('lead');
const status=document.getElementById('status');
const actions=document.getElementById('actions');
const summary=document.getElementById('summary');
const purchaseIdEl=document.getElementById('purchaseId');
const expiresAtEl=document.getElementById('expiresAt');
const openCard=document.getElementById('openCard');

function fail(msg){
  icon.textContent='!';
  title.textContent='確認できませんでした';
  lead.textContent='決済状況を確認できませんでした。';
  status.className='status err';
  status.textContent=msg;
  actions.hidden=true;
  summary.hidden=true;
}

function formatDate(v){
  const d=v?new Date(v):null;
  if(!d || isNaN(d))return '—';
  return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric'}).format(d);
}



async function check(){
  if(!sessionId.startsWith('cs_')||!/^[0-9a-f-]{36}$/i.test(publicId)){
    fail('決済情報が不足しています。');
    return;
  }

  for(let i=0;i<15;i++){
    try{
      const r=await fetch(STATUS_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session_id:sessionId,public_id:publicId})
      });
      const d=await r.json().catch(()=>({}));

      if(r.ok&&d.ok&&d.paid){
        const finalUrl='finished.html?session_id='+encodeURIComponent(sessionId)+'&public_id='+encodeURIComponent(publicId);

        icon.textContent='✓';
        title.textContent='完成しました';
        lead.textContent='480円（税込）の決済を確認しました。コエフォトが有効になりました。';
        status.className='status ok';
        status.textContent='ご購入ありがとうございます。';

        purchaseIdEl.textContent=d.purchase_id||'—';
        expiresAtEl.textContent=formatDate(d.expires_at);
        openCard.href=finalUrl;

        summary.hidden=false;
        actions.hidden=false;

        sessionStorage.setItem('koephoto-purchase-draft',JSON.stringify({
          public_id:publicId,
          purchase_id:d.purchase_id||null,
          status:'paid',
          session_id:sessionId,
          expires_at:d.expires_at||null
        }));
        return;
      }

      if(r.status===404){
        fail('この決済情報に対応するコエフォトが見つかりません。');
        return;
      }

      status.textContent='決済完了通知を待っています… ('+(i+1)+'/15)';
    }catch(e){
      status.textContent='通信を再確認しています… ('+(i+1)+'/15)';
    }
    await new Promise(r=>setTimeout(r,1000));
  }

  fail('決済は完了していても反映に時間がかかっている可能性があります。少し待ってから再読み込みしてください。');
}

check();
</script>
</body>
</html>
