<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday｜コエフォト</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b1f3a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100svh;padding:14px 8px 24px;display:flex;justify-content:center;align-items:flex-start;
  background:radial-gradient(circle at 50% -10%,#294f7d,#142f54 38%,#091a33 80%)}
.stage{
  position:relative;
  width:min(600px,100%);
  aspect-ratio:2/3;
  overflow:hidden;
  background:#fbf7ed;
  box-shadow:0 24px 60px #0007;
}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}

/* Generated template's empty photo frame. Actual user photo is inserted here deterministically. */
.photo{
  position:absolute;
  left:7.6%;
  top:22.9%;
  width:84.6%;
  height:34.0%;
  overflow:hidden;
  clip-path:polygon(0.2% 1.5%,99.0% 0%,100% 96.3%,1.5% 100%);
  background:#eee8df;
}
.photo img{width:100%;height:100%;display:block;object-fit:cover}

/* Functional player is placed over the visual player drawn in the template. */
.playHotspot{
  position:absolute;
  left:12.4%;
  top:65.4%;
  width:10.7%;
  aspect-ratio:1;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.playHotspot:focus-visible{outline:3px solid #d0aa55;outline-offset:3px}
.playState{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:clamp(15px,4vw,27px);
  font-weight:700;
  pointer-events:none;
}
.progressTrack{
  position:absolute;
  left:29.0%;
  top:68.35%;
  width:39.5%;
  height:3px;
  border-radius:99px;
  overflow:hidden;
  pointer-events:none;
}
.progressFill{height:100%;width:0;background:#0d467b;border-radius:99px}
.timeBox{
  position:absolute;
  left:70.0%;
  top:66.45%;
  width:15.0%;
  height:3.8%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fbf8f0;
  color:#8091a8;
  font-size:clamp(8px,2.2vw,14px);
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}

/* Sender is placed on the same simple underline style as the message card. */
.sender{
  position:absolute;
  left:31.0%;
  top:79.05%;
  width:46.5%;
  height:3.0%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0 2% .2%;
  color:#9a793f;
  font-weight:500;
  font-size:clamp(12px,3.5vw,23px);
  white-space:nowrap;
  overflow:hidden;
}
.brand{
  position:absolute;
  left:0;
  right:0;
  bottom:7.3%;
  text-align:center;
  color:#988a78;
  opacity:.72;
  font-size:clamp(8px,2vw,12px);
  font-weight:600;
  letter-spacing:.06em;
}
audio{display:none}
</style>
</head>
<body>
<main class="page">
  <section class="stage" aria-label="Classic Birthday ボイスページ">
    <img class="bg" src="classic-birthday-voice-v6-bg.png" alt="">
    <div class="photo"><img id="voicePhoto" alt=""></div>

    <button class="playHotspot" id="playBtn" type="button" aria-label="音声を再生">
      <span class="playState" id="playState">▶</span>
    </button>
    <div class="progressTrack"><div class="progressFill" id="progress"></div></div>
    <div class="timeBox" id="timeBox">0:00 / --:--</div>

    <div class="sender" id="sender"></div>
    <div class="brand">コエフォト</div>
    <audio id="voiceAudio" preload="metadata"></audio>
  </section>
</main>
<script>
function kpDB(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function kpGet(k){const x=await kpDB();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}
function fmt(s){
  if(!Number.isFinite(s)) return "--:--";
  s=Math.max(0,Math.floor(s));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
(async()=>{
  const draft=JSON.parse(sessionStorage.getItem('koephoto-draft')||'{}');
  document.getElementById('sender').textContent=draft.sender||'';
  const photo=await kpGet('photo'), audioBlob=await kpGet('audio');
  if(photo) document.getElementById('voicePhoto').src=URL.createObjectURL(photo);
  if(audioBlob) document.getElementById('voiceAudio').src=URL.createObjectURL(audioBlob);
})();

const audio=document.getElementById('voiceAudio');
const btn=document.getElementById('playBtn');
const state=document.getElementById('playState');
const progress=document.getElementById('progress');
const timeBox=document.getElementById('timeBox');

function updateTime(){
  timeBox.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  progress.style.width=(audio.duration ? (audio.currentTime/audio.duration)*100 : 0)+"%";
}
btn.addEventListener('click',async()=>{
  if(audio.paused){
    try{await audio.play();state.textContent='Ⅱ';btn.setAttribute('aria-label','音声を一時停止')}catch(e){console.error(e)}
  }else{
    audio.pause();state.textContent='▶';btn.setAttribute('aria-label','音声を再生');
  }
});
audio.addEventListener('loadedmetadata',updateTime);
audio.addEventListener('durationchange',updateTime);
audio.addEventListener('timeupdate',updateTime);
audio.addEventListener('ended',()=>{state.textContent='▶';audio.currentTime=0;updateTime()});
audio.addEventListener('pause',()=>{if(!audio.ended)state.textContent='▶'});
audio.addEventListener('play',()=>{state.textContent='Ⅱ'});
</script>
</body>
</html>
