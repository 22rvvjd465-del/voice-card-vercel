<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classic Birthday｜コエフォト</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5efe6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{padding:10px 6px 28px}.card{position:relative;width:min(620px,100%);aspect-ratio:1060/1484;margin:auto;background:#fbf8f1;overflow:hidden;box-shadow:0 12px 30px #5b493326}
.master{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.photo{
 position:absolute;z-index:3;
 left:3.68%;top:16.78%;width:92.64%;height:44.95%;
 clip-path:polygon(0% 5.10%,97.66% 0%,100% 94.90%,2.24% 100%);
 overflow:hidden;background:#eee9df
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.cover{
 position:absolute;z-index:4;left:0;right:0;top:61.9%;bottom:0;background:#fbf8f1
}
.flower{position:absolute;z-index:8;left:74.53%;top:0;width:25.47%;height:auto;pointer-events:none}
.hearts{position:absolute;z-index:8;left:0;top:53.23%;width:14.15%;height:auto;pointer-events:none}
.voiceLabel{position:absolute;z-index:9;left:0;right:0;top:64.3%;text-align:center;color:#073d77;font-size:clamp(15px,3.6vw,23px);font-weight:700}
.player{position:absolute;z-index:9;left:10%;right:10%;top:69.1%;height:7%;display:flex;align-items:center;gap:4%;padding:0 4% 0 2%;background:#fff;border-radius:18px;box-shadow:0 4px 16px #493b2714}
.play{width:13%;aspect-ratio:1;border:0;border-radius:50%;background:#07508b;display:grid;place-items:center}
.tri{width:0;height:0;margin-left:7%;border-top:.8em solid transparent;border-bottom:.8em solid transparent;border-left:1.15em solid #fff}
.track{height:5px;background:#d9dde0;border-radius:9px;flex:1;overflow:hidden}.fill{height:100%;width:0;background:#07508b}
.time{font-size:clamp(8px,2vw,13px);color:#8590a0;white-space:nowrap}
.from{position:absolute;z-index:9;left:14%;right:14%;top:80.5%;height:5%;display:flex;align-items:flex-end;gap:4%}
.from b{font-family:Georgia,serif;letter-spacing:.17em;color:#073d77;font-size:clamp(11px,2.6vw,17px);padding-bottom:4px}
.line{position:relative;flex:1;border-bottom:1.5px solid #bd8d32;height:100%}.sender{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#9a763b;font-size:clamp(13px,3.2vw,21px)}
.footerWave{position:absolute;z-index:6;left:-5%;right:-5%;bottom:-4%;height:16%;background:#084c84;border-radius:55% 45% 0 0/45% 35% 0 0}
.goldWave{position:absolute;z-index:5;left:-4%;right:-4%;bottom:6%;height:6%;background:#c59638;border-radius:50%;transform:rotate(3deg)}
.brand{text-align:center;padding:18px 8px 0;color:#173f69;font-weight:700;letter-spacing:.08em}.tag{margin-top:6px;color:#9a8c79;font:10px Georgia,serif;letter-spacing:.18em;font-weight:400}
audio{display:none}
</style></head><body><main class="page">
<section class="card">
<img class="master" src="classic-birthday-message-master.png" alt="">
<div class="photo"><img id="photo" alt=""></div>
<div class="cover"></div>
<img class="flower" src="flower-ribbon-from-master.png" alt="">
<img class="hearts" src="left-hearts-from-master.png" alt="">
<div class="voiceLabel">♬　声を聞いてね♪</div>
<div class="player"><button id="play" class="play"><span class="tri"></span></button><div class="track"><div id="fill" class="fill"></div></div><div id="time" class="time">0:00 / --:--</div></div>
<div class="from"><b>FROM</b><div class="line"><div id="sender" class="sender"></div></div></div>
<div class="goldWave"></div><div class="footerWave"></div>
<audio id="audio" preload="metadata"></audio>
</section>
<div class="brand">コエフォト<div class="tag">A PHOTO, A VOICE, A MEMORY.</div></div>
</main>
<script>
function db(){return new Promise((ok,ng)=>{let r=indexedDB.open("koephoto-preview",2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){let x=await db();let v=await new Promise((ok,ng)=>{let t=x.transaction("draft"),r=t.objectStore("draft").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}
function fmt(s){if(!Number.isFinite(s))return"--:--";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
(async()=>{let d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");sender.textContent=d.sender||"";let p=await get("photo"),a=await get("audio");if(p)photo.src=URL.createObjectURL(p);if(a)audio.src=URL.createObjectURL(a)})();
play.onclick=async()=>{audio.paused?await audio.play():audio.pause()};
function u(){time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%"}
audio.onloadedmetadata=u;audio.ontimeupdate=u;audio.onended=()=>{audio.currentTime=0;u()}
</script></body></html>
