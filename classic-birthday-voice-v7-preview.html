<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday｜コエフォト</title>
<style>
:root{--navy:#123f6d;--gold:#b88b3b;--ivory:#faf6ed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5efe6}
.web{min-height:100svh;padding:14px 8px 26px}
.card{position:relative;width:min(600px,100%);aspect-ratio:2/3;margin:auto;overflow:hidden;background:var(--ivory);box-shadow:0 12px 32px #5b493329}
.bg,.decor{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.bg{z-index:1}.decor{z-index:4}
.photo{position:absolute;z-index:2;left:8.4%;top:23.7%;width:82.5%;height:31.5%;overflow:hidden;clip-path:polygon(.5% 1.4%,98.8% 0,100% 96.2%,1.5% 100%);background:#eee7dc}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;z-index:7;left:12.5%;top:65.5%;width:10.5%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer}
.state{position:absolute;z-index:8;left:12.5%;top:65.5%;width:10.5%;aspect-ratio:1;display:grid;place-items:center;color:white;font-size:clamp(14px,4vw,25px);font-weight:700;pointer-events:none}
.track{position:absolute;z-index:8;left:29.2%;top:68.25%;width:39%;height:3px;overflow:hidden;border-radius:99px}
.fill{width:0;height:100%;background:var(--navy)}
.time{position:absolute;z-index:8;left:70.1%;top:66.3%;width:15.2%;height:4%;display:flex;align-items:center;justify-content:center;background:#fbf8f0;color:#8290a4;font-size:clamp(8px,2.1vw,14px);font-variant-numeric:tabular-nums}
.sender{position:absolute;z-index:8;left:31%;top:76.8%;width:46.5%;height:2.2%;display:flex;align-items:flex-end;justify-content:center;color:#9a763b;font-size:clamp(12px,3.3vw,22px);line-height:1;white-space:nowrap;overflow:hidden;padding-bottom:.25%}
audio{display:none}
.brand{width:min(600px,100%);margin:0 auto;text-align:center;padding:17px 8px 0}
.brandname{font-size:15px;font-weight:700;letter-spacing:.08em;color:#173f69}
.tag{margin-top:6px;font:10px Georgia,"Times New Roman",serif;letter-spacing:.18em;color:#9a8c79}
@media(max-width:420px){.web{padding:8px 6px 22px}.brand{padding-top:14px}.brandname{font-size:14px}.tag{font-size:9px;letter-spacing:.13em}}
</style></head><body>
<main class="web">
<section class="card">
<img class="bg" src="classic-birthday-voice-v6-bg.png" alt="">
<div class="photo"><img id="photo" alt=""></div>
<img class="decor" src="classic-birthday-voice-v6-decor.png" alt="">
<button class="play" id="play" aria-label="音声を再生"></button><div class="state" id="state">▶</div>
<div class="track"><div class="fill" id="fill"></div></div><div class="time" id="time">0:00 / --:--</div>
<div class="sender" id="sender"></div><audio id="audio" preload="metadata"></audio>
</section>
<footer class="brand"><div class="brandname">コエフォト</div><div class="tag">A PHOTO, A VOICE, A MEMORY.</div></footer>
</main>
<script>
function openDB(){return new Promise((ok,ng)=>{const r=indexedDB.open("koephoto-preview",2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function getBlob(k){const x=await openDB();const v=await new Promise((ok,ng)=>{const t=x.transaction("draft");const r=t.objectStore("draft").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}
function fmt(s){if(!Number.isFinite(s))return"--:--";s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
(async()=>{const d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");sender.textContent=d.sender||"";const p=await getBlob("photo"),a=await getBlob("audio");if(p)photo.src=URL.createObjectURL(p);if(a)audio.src=URL.createObjectURL(a)})();
const audio=document.getElementById("audio"),play=document.getElementById("play"),state=document.getElementById("state"),fill=document.getElementById("fill"),time=document.getElementById("time");
function upd(){time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%"}
play.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause()};
audio.onplay=()=>state.textContent="Ⅱ";audio.onpause=()=>state.textContent="▶";audio.onloadedmetadata=upd;audio.ontimeupdate=upd;audio.onended=()=>{audio.currentTime=0;upd()};
</script></body></html>
