<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コエフォト｜Classic Birthday プレビュー v27</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --bg:#fffdfa;
  --panel:#fbf7f2;
  --ink:#2f2722;
  --brown:#9f7654;
  --brown-dark:#7d5d44;
  --brown-light:#b58b68;
  --muted:#8c827a;
  --line:#e7ddd4;
  --field:#ffffff;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 64px}

/* Header */
.preview-header{display:flex;align-items:flex-end;gap:10px;margin-bottom:28px}
.preview-brand{font-size:30px;font-weight:900;letter-spacing:.08em;color:var(--brown-dark);line-height:1}
.preview-tag{font-size:13px;font-weight:700;color:var(--brown-dark);padding-bottom:3px}

/* Progress */
.progress{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  margin:0 70px 38px;
}
.progress::before{
  content:"";
  position:absolute;
  left:12.5%;
  right:12.5%;
  top:22px;
  height:4px;
  background:#eee9e5;
  border-radius:999px;
  z-index:0;
}
.progress-step{
  position:relative;
  z-index:1;
  text-align:center;
  color:#6f635a;
}
.progress-dot{
  width:46px;
  height:46px;
  border-radius:50%;
  margin:0 auto 9px;
  display:grid;
  place-items:center;
  background:#f0ece8;
  color:#72665d;
  font-size:16px;
}
.progress-step.current .progress-dot{
  background:var(--brown-light);
  color:#fff;
}
.progress-label{
  font-size:15px;
  font-weight:800;
}
.progress-step.current .progress-label{
  color:var(--brown-dark);
}

/* Heading */
.top{text-align:center;margin-bottom:18px}
.top .badge{
  display:inline-block;
  background:#f2e9df;
  color:var(--brown-dark);
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:10px
}
.top h1{font-size:32px;line-height:1.3;margin:0;color:var(--ink)}
.top p{font-size:12px;color:var(--muted)}

/* Main preview panel */
.preview-shell{
  background:linear-gradient(135deg,#fcf9f5,#fffdfb);
  border:1px solid #eee5dd;
  border-radius:22px;
  padding:24px;
  box-shadow:0 10px 28px rgba(109,77,51,.04);
}
.tabs{display:none}

/* Segmented switch */
.preview-mode-wrap{margin:0 0 18px}
.preview-mode-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:5px;
  border-radius:16px;
  background:#ece5de;
  box-shadow:inset 0 1px 2px rgba(65,50,39,.05);
}
.preview-mode-btn{
  appearance:none;border:0;border-radius:12px;background:transparent;
  color:#75695f;min-height:68px;padding:10px 12px;cursor:pointer
}
.preview-mode-btn .mode-main{display:block;font-size:17px;font-weight:900;line-height:1.25}
.preview-mode-btn .mode-sub{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.06em;opacity:.72}
.preview-mode-btn.active{
  background:#fff;color:var(--ink);
  box-shadow:0 2px 10px rgba(65,50,39,.10)
}

/* Preview panes */
.pane{display:none}.pane.on{display:block}
.caption{
  text-align:center;
  font-size:14px;
  color:#76695e;
  line-height:1.7;
  margin:10px auto 18px;
  max-width:760px
}
.canvasWrap{
  background:#f4efe9;
  border:1px solid #ebe2da;
  border-radius:18px;
  padding:14px;
  overflow:auto
}
canvas{
  display:block;
  width:100%;height:auto;
  max-width:620px;
  margin:auto;
  background:white;
  border-radius:8px;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.voiceFrameWrap{
  background:#0b1f3a;
  border-radius:18px;
  overflow:hidden;
  max-width:620px;
  margin:0 auto
}
iframe{display:block;width:100%;height:860px;border:0;background:#091a33}

/* Photo adjustment */
.photoAdjust{
  display:none;
  margin:16px auto 0;
  max-width:620px;
  padding:16px 18px;
  border:1px solid #e5d7ca;
  border-radius:14px;
  background:#f8f2ec;
  text-align:left
}
.photoAdjust.on{display:block}
.photoAdjust .adjustTitle{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:900;color:var(--brown-dark);
  margin-bottom:7px
}
.photoAdjust .adjustTitle::before{
  content:"✥";font-size:15px;font-weight:400;color:var(--brown)
}
.photoAdjust .adjustNote{
  font-size:13px!important;
  color:#76695e;
  line-height:1.65
}
#card.photo-dragging{cursor:grabbing}

/* Actions */
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:24px
}
.actions button{
  min-height:56px;
  padding:14px 18px;
  border-radius:14px;
  font-size:15px!important;
  font-weight:900!important;
  cursor:pointer
}
.actions button:first-child{
  border:1px solid #d7c7b8;
  background:#fff;
  color:var(--brown-dark)
}
.actions .buy{
  border:0;
  background:linear-gradient(180deg,#a77d5a,#956c4c);
  color:#fff;
  box-shadow:0 7px 18px rgba(128,87,54,.15)
}
.actions button:active{transform:translateY(1px)}
.price{
  text-align:center;
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
  margin-top:10px
}

@media(max-width:760px){
  .wrap{padding:18px 14px 48px}
  .preview-header{margin-bottom:22px;align-items:center}
  .preview-brand{font-size:25px}
  .preview-tag{font-size:11px;padding-bottom:0}
  .progress{margin:0 6px 28px}
  .progress::before{top:18px;height:3px}
  .progress-dot{width:38px;height:38px;margin-bottom:7px;font-size:14px}
  .progress-label{font-size:11px}
  .top h1{font-size:26px}
  .preview-shell{padding:16px 14px 18px;border-radius:18px}
  .preview-mode-btn{min-height:60px;padding:8px 6px}
  .preview-mode-btn .mode-main{font-size:15px}
  .preview-mode-btn .mode-sub{font-size:10px}
  .caption{font-size:13px;margin:8px 2px 14px}
  .canvasWrap{padding:9px;border-radius:14px}
  .photoAdjust{padding:13px 14px}
  .photoAdjust .adjustTitle{font-size:14px!important}
  .photoAdjust .adjustNote{font-size:12px!important}
  .actions{grid-template-columns:1fr;gap:9px}
  .actions button{min-height:54px}
}
@media(max-width:390px){
  .preview-tag{display:none}
  .progress-label{font-size:10px}
}
</style>
</head><body><main class="wrap">
<header class="preview-header">
  <div class="preview-brand">コエフォト</div>
  <div class="preview-tag">写真と声で、想いを届ける</div>
</header>
<nav class="progress" aria-label="作成の進捗">
  <div class="progress-step"><div class="progress-dot">1</div><div class="progress-label">入力</div></div>
  <div class="progress-step current"><div class="progress-dot">2</div><div class="progress-label">プレビュー</div></div>
  <div class="progress-step"><div class="progress-dot">3</div><div class="progress-label">購入確認</div></div>
  <div class="progress-step"><div class="progress-dot">4</div><div class="progress-label">完成</div></div>
</nav>
<div class="top"><span class="badge">Classic Birthday</span><h1>プレビューを確認</h1></div>
<div class="preview-shell">
<div style="display:none" class="tabs"><button id="tm" class="on">メッセージカード</button><button id="tv">ボイスページ</button></div>
<section class="preview-mode-wrap">
  
  <div class="preview-mode-switch" role="tablist" aria-label="完成イメージ">
    <button type="button" class="preview-mode-btn active" id="simpleCardBtn" role="tab" aria-selected="true">
      <span class="mode-main">贈るカード</span>
      <span class="mode-sub">MESSAGE CARD</span>
    </button>
    <button type="button" class="preview-mode-btn" id="simpleVoiceBtn" role="tab" aria-selected="false">
      <span class="mode-main">QRから見るページ</span>
      <span class="mode-sub">VOICE PAGE</span>
    </button>
  </div>
</section>
<section id="pm" class="pane on">
<div class="caption">写真とメッセージ、声につながるQRコードを載せて、印刷したり画像で送ったりして贈れるカードです。</div><div class="canvasWrap"><canvas id="card" width="1060" height="1484"></canvas></div><div id="photoAdjust" class="photoAdjust on">
  <div class="adjustTitle">写真の表示位置</div>
  <div id="dragNote" class="adjustNote">写真を指で動かして位置を調整できます。2本指で拡大・縮小できます。</div>
</div></section>
<section id="pv" class="pane"><div class="caption">受け取った人がスマホで見るページ</div><div class="voiceFrameWrap"><iframe id="voiceFrame" src="classic-birthday-voice.html" title="Classic Birthday ボイスページ"></iframe></div></section>
</div>
<div class="actions"><button onclick="history.back()">← 入力を修正</button><button id="buyBtn" class="buy">購入内容を確認する →</button></div>
<div id="purchaseStatus" class="price" aria-live="polite">次の画面で料金・保存期間・データの取扱いをご確認いただけます。</div>
</main>
<script>
const $=id=>document.getElementById(id);
window.addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  if(!e.data || e.data.type!=='koefoto-voice-height')return;
  const frame=$('voiceFrame');
  if(frame && Number.isFinite(e.data.height)){
    frame.style.height=Math.max(100,e.data.height)+'px';
  }
});
$('tv').onclick=()=>{$('tv').classList.add('on');$('tm').classList.remove('on');$('pv').classList.add('on');$('pm').classList.remove('on');$('photoAdjust').classList.remove('on')};
$('tm').onclick=()=>{$('tm').classList.add('on');$('tv').classList.remove('on');$('pm').classList.add('on');$('pv').classList.remove('on');$('photoAdjust').classList.add('on')};
function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){const x=await db();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}

  function fitCanvasName(ctx,text,fontFamily,fontWeight,maxPx,minPx,maxWidth){
    let lo=minPx, hi=maxPx, best=minPx;
    for(let i=0;i<18;i++){
      const px=(lo+hi)/2;
      ctx.font=fontWeight+' '+px+'px '+fontFamily;
      if(ctx.measureText(text).width<=maxWidth){best=px;lo=px}else{hi=px}
    }
    ctx.font=fontWeight+' '+best.toFixed(1)+'px '+fontFamily;
    return best;
  }

function wrap(ctx,text,maxWidth){
  const lines=[];
  const paragraphs=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  paragraphs.forEach((paragraph,pi)=>{
    if(paragraph===''){lines.push('');return;}
    let cur='';
    for(const ch of paragraph){
      if(!cur || ctx.measureText(cur+ch).width<=maxWidth){cur+=ch;}
      else{lines.push(cur);cur=ch;}
    }
    if(cur)lines.push(cur);
  });
  return lines;
}
(async()=>{
  const draft=JSON.parse(sessionStorage.getItem('koephoto-draft')||'{}');
  let focusX=Number.isFinite(Number(draft.photoFocusX))?Number(draft.photoFocusX):0.5;
  let focusY=Number.isFinite(Number(draft.photoFocusY))?Number(draft.photoFocusY):0.5;
  let photoZoom=Number.isFinite(Number(draft.photoZoom))?Number(draft.photoZoom):1;
  focusX=Math.min(1,Math.max(0,focusX)); focusY=Math.min(1,Math.max(0,focusY));
  photoZoom=Math.min(2.5,Math.max(1,photoZoom));
  if(!draft.message){alert('作成データがありません。入力画面に戻ります。');location.href='index.html';return}
  const photo=await get('photo');
  if(!(photo instanceof Blob) || !photo.size){
    alert('写真データが見つかりません。入力画面で写真を選び直してください。');
    location.href='index.html';
    return;
  }
  const pu=URL.createObjectURL(photo);
  const c=$('card'),ctx=c.getContext('2d');

  function loadImage(src){
    return new Promise((resolve,reject)=>{
      const x=new Image();
      x.onload=()=>resolve(x);
      x.onerror=()=>reject(new Error('image_load_failed'));
      x.src=src;
    });
  }

  let base,img,decor;
  try{
    [base,img,decor]=await Promise.all([
      loadImage('classic-birthday-message.png'),
      loadImage(pu),
      loadImage('classic-birthday-decor-overlay.png')
    ]);
  }catch(err){
    console.error('preview image load failed',err);
    URL.revokeObjectURL(pu);
    alert('写真データの読み込みに失敗しました。入力画面で写真を選び直してください。');
    location.href='index.html';
    return;
  }
  // 初回表示時のフォント差し替わりを防ぐ。
  // 必要フォントが実際に使用可能になるまでカードを描画しない。
  if(document.fonts){
    await Promise.all([
      document.fonts.load('500 28px "Zen Maru Gothic"'),
      document.fonts.load('600 28px "Zen Maru Gothic"'),
      document.fonts.ready
    ]);
  }
  const p1={x:48,y:334},p2={x:989,y:286},p3={x:1012,y:854},p4={x:70,y:902};
  const minX=Math.min(p1.x,p2.x,p3.x,p4.x),maxX=Math.max(p1.x,p2.x,p3.x,p4.x);
  const minY=Math.min(p1.y,p2.y,p3.y,p4.y),maxY=Math.max(p1.y,p2.y,p3.y,p4.y);
  const fw=maxX-minX,fh=maxY-minY,ir=img.width/img.height,fr=fw/fh;
  let baseSw=img.width,baseSh=img.height;
  if(ir>fr){baseSw=img.height*fr}else{baseSh=img.width/fr}

  function cropSize(){
    return {sw:baseSw/photoZoom,sh:baseSh/photoZoom};
  }
  function movement(){
    const {sw,sh}=cropSize();
    return {
      canMoveX:(img.width-sw)>0.5,
      canMoveY:(img.height-sh)>0.5,
      sw,sh
    };
  }

  function drawCard(){
    ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(base,0,0,c.width,c.height);

    // 写真枠。写真はcover表示し、focus値で表示位置を直接調整する。
    const {canMoveX,canMoveY,sw,sh}=movement();
    const sx=canMoveX?(img.width-sw)*focusX:0;
    const sy=canMoveY?(img.height-sh)*focusY:0;
    ctx.save();ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.clip();
    ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);ctx.restore();

    // 花リボン・左下ハート等を写真より前面に重ねる。
    ctx.drawImage(decor,0,0,c.width,c.height);

    // To欄：名前のみHTML/Canvas側で表示。「へ」は付けない。
    const recipient=[...(draft.recipient||'')].slice(0,15).join('');
    ctx.fillStyle='#0b347f';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    fitCanvasName(
      ctx,recipient,
      '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',
      '500',40,14,455
    );
    ctx.fillText(recipient,548,252);

    // MESSAGE本文：最大5行、自動縮小。
    ctx.textAlign='left';ctx.fillStyle='#46515c';
    const rules=[1011,1060,1108,1157,1207],maxw=480;let size=(draft.message||'').length<=35?34:(draft.message||'').length<=65?31:28,lines=[];
    while(size>=24){ctx.font='500 '+size+'px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';lines=wrap(ctx,draft.message||'',maxw);if(lines.length<=5)break;size--}
    lines.slice(0,5).forEach((line,i)=>ctx.fillText(line,120,rules[i]-6));

    // FROM欄：贈り主名。
    const sender=[...(draft.sender||'')].slice(0,15).join('');
    ctx.fillStyle='#123d7a';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    fitCanvasName(
      ctx,sender,
      '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',
      '500',40,14,310
    );
    ctx.fillText(sender,400,1265);

    // プレビューではQRを生成しない。実QRは完成版で差し込む。
    ctx.fillStyle='#9b8e7c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='24px "Hiragino Sans","Yu Gothic",sans-serif';ctx.fillText('QRコード',847,1086);

    // 期限は背景画像ではなくプログラム側で表示。
    ctx.textBaseline='alphabetic';ctx.textAlign='center';ctx.font='18px "Hiragino Sans","Yu Gothic",sans-serif';ctx.fillText('閲覧・ダウンロード期限',847,1224);ctx.fillText('購入日から1年間',847,1248);ctx.textAlign='left';
  }
  drawCard();

  const dragNote=$('dragNote');
  const photoAdjust=$('photoAdjust');

  function updateAdjustUI(){
    const {canMoveX,canMoveY}=movement();
    const movable=canMoveX||canMoveY;
    c.classList.toggle('photo-draggable',movable);
    const touchDevice=(navigator.maxTouchPoints||0)>0 ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    dragNote.textContent=touchDevice
      ? '写真を指で動かして位置を調整できます。2本指で拡大・縮小できます。'
      : '写真をドラッグして位置を調整できます。マウスホイールで拡大・縮小できます。';
  }

  updateAdjustUI();

  function syncVoicePhoto(){
    const frame=$('voiceFrame');
    if(frame && frame.contentWindow){
      frame.contentWindow.postMessage(
        {type:'koefoto-photo-transform',x:focusX,y:focusY,zoom:photoZoom},
        location.origin
      );
    }
  }

  function saveFocus(){
    draft.photoFocusX=focusX;
    draft.photoFocusY=focusY;
    draft.photoZoom=photoZoom;
    sessionStorage.setItem('koephoto-draft',JSON.stringify(draft));
    syncVoicePhoto();
  }

  const voiceFrame=$('voiceFrame');
  if(voiceFrame){
    voiceFrame.addEventListener('load',()=>setTimeout(syncVoicePhoto,0));
  }


  // 写真部分を直接ドラッグ。枠外からの操作は無視する。
  function canvasPoint(ev){
    const r=c.getBoundingClientRect();
    return {x:(ev.clientX-r.left)*c.width/r.width,y:(ev.clientY-r.top)*c.height/r.height};
  }
  function inPhotoQuad(pt){
    const poly=[p1,p2,p3,p4];
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a=poly[i],b=poly[j];
      if(((a.y>pt.y)!==(b.y>pt.y)) && (pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)) inside=!inside;
    }
    return inside;
  }

  let dragging=false,last=null,raf=0;
  const activePointers=new Map();
  let pinchStartDistance=0;
  let pinchStartZoom=photoZoom;

  function pointerDistance(){
    const pts=[...activePointers.values()];
    if(pts.length<2)return 0;
    return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  }

  c.addEventListener('pointerdown',ev=>{
    const pt=canvasPoint(ev);
    if(!inPhotoQuad(pt))return;
    activePointers.set(ev.pointerId,pt);
    c.setPointerCapture?.(ev.pointerId);

    if(activePointers.size===1){
      const {canMoveX,canMoveY}=movement();
      if(canMoveX||canMoveY){
        dragging=true;
        last=pt;
        c.classList.add('photo-dragging');
      }
    }else if(activePointers.size===2){
      dragging=false;
      last=null;
      c.classList.remove('photo-dragging');
      pinchStartDistance=pointerDistance();
      pinchStartZoom=photoZoom;
    }
    ev.preventDefault();
  });

  c.addEventListener('pointermove',ev=>{
    if(!activePointers.has(ev.pointerId))return;
    const pt=canvasPoint(ev);
    activePointers.set(ev.pointerId,pt);

    if(activePointers.size>=2){
      const d=pointerDistance();
      if(pinchStartDistance>0 && d>0){
        photoZoom=Math.min(2.5,Math.max(1,pinchStartZoom*(d/pinchStartDistance)));
        updateAdjustUI();
        if(!raf){
          raf=requestAnimationFrame(()=>{raf=0;drawCard();syncVoicePhoto()});
        }
      }
      ev.preventDefault();
      return;
    }

    if(!dragging||!last)return;
    const dx=pt.x-last.x,dy=pt.y-last.y;
    last=pt;
    const {canMoveX,canMoveY,sw,sh}=movement();
    if(canMoveX){
      const maxShift=(img.width-sw)*(fw/sw);
      if(maxShift>0) focusX=Math.min(1,Math.max(0,focusX-dx/maxShift));
    }
    if(canMoveY){
      const maxShift=(img.height-sh)*(fh/sh);
      if(maxShift>0) focusY=Math.min(1,Math.max(0,focusY-dy/maxShift));
    }
    if(!raf){
      raf=requestAnimationFrame(()=>{raf=0;drawCard();syncVoicePhoto()});
    }
    ev.preventDefault();
  });

  function endPointer(ev){
    activePointers.delete(ev.pointerId);
    try{c.releasePointerCapture?.(ev.pointerId)}catch(_){}

    if(activePointers.size===1){
      const [remaining]=activePointers.values();
      last=remaining;
      const {canMoveX,canMoveY}=movement();
      dragging=canMoveX||canMoveY;
      if(dragging)c.classList.add('photo-dragging');
      pinchStartDistance=0;
    }else if(activePointers.size===0){
      dragging=false;
      last=null;
      pinchStartDistance=0;
      c.classList.remove('photo-dragging');
      saveFocus();
    }
  }

  c.addEventListener('pointerup',endPointer);
  c.addEventListener('pointercancel',endPointer);

  // iPhone Safari対策:
  // 2本指操作をページ全体のピンチズームに渡さず、カード写真の拡大縮小として扱う。
  const stopNativePinch=ev=>{
    if(ev.cancelable) ev.preventDefault();
  };
  c.addEventListener('gesturestart',stopNativePinch,{passive:false});
  c.addEventListener('gesturechange',stopNativePinch,{passive:false});
  c.addEventListener('gestureend',stopNativePinch,{passive:false});
  c.addEventListener('touchstart',ev=>{
    if(ev.touches && ev.touches.length>=2 && ev.cancelable) ev.preventDefault();
  },{passive:false});
  c.addEventListener('touchmove',ev=>{
    if(ev.touches && ev.touches.length>=2 && ev.cancelable) ev.preventDefault();
  },{passive:false});

  // PC: 写真上のマウスホイールで拡大・縮小。
  c.addEventListener('wheel',ev=>{
    const pt=canvasPoint(ev);
    if(!inPhotoQuad(pt))return;
    ev.preventDefault();
    const factor=ev.deltaY<0 ? 1.08 : 1/1.08;
    photoZoom=Math.min(2.5,Math.max(1,photoZoom*factor));
    updateAdjustUI();
    drawCard();
    syncVoicePhoto();
    saveFocus();
  },{passive:false});
})();
</script>

  if(/\.(jpg|jpeg)$/.test(n))return'image/jpeg';
  if(/\.png$/.test(n))return'image/png';

  const n=(file?.name||'').toLowerCase();

<script>
(() => {

  const voice = document.getElementById('simpleVoiceBtn');
  const candidates = [...document.querySelectorAll('button, [role="tab"]')];

  const oldCard = candidates.find(el =>
    el !== card && el !== voice &&
    (el.textContent || '').trim().includes('メッセージカード')
  );
  const oldVoice = candidates.find(el =>
    el !== card && el !== voice &&
    (el.textContent || '').trim().includes('ボイスページ')
  );

  function activate(which){
    const isCard = which === 'card';
    card?.classList.toggle('active', isCard);
    voice?.classList.toggle('active', !isCard);
    card?.setAttribute('aria-selected', String(isCard));
    voice?.setAttribute('aria-selected', String(!isCard));
  }

  card?.addEventListener('click', () => {
    oldCard?.click();
    activate('card');
  });
  voice?.addEventListener('click', () => {
    oldVoice?.click();
    activate('voice');
  });
})();
