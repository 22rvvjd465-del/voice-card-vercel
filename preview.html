<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コエフォト｜Classic Birthday プレビュー v27</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#4e4339;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.top{text-align:center}.top h1{font-size:21px;margin:7px}.top p{font-size:12px;color:#827568}
.badge{display:inline-block;background:#eee4d6;padding:4px 8px;border-radius:999px;font-size:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.tabs button{padding:12px;border:1px solid #cbb79c;background:#fffaf2;border-radius:12px;color:#655648;font-weight:700}.tabs button.on{background:#9f8064;color:white}
.pane{display:none}.pane.on{display:block}.caption{text-align:center;font-size:12px;color:#817466;margin:8px 0 12px}
.voiceFrameWrap{background:#0b1f3a;border-radius:16px;overflow:hidden}
iframe{display:block;width:100%;height:860px;border:0;background:#091a33}
.canvasWrap{background:#e9e4db;border-radius:16px;padding:10px;overflow:auto}canvas{display:block;width:100%;height:auto;max-width:600px;margin:auto;background:white}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.actions button{padding:14px;border-radius:13px;border:1px solid #bca68d;background:#fffaf2;color:#655648;font-weight:700}.actions .buy{background:#9f8064;color:#fff;border:0}.price{text-align:center;font-size:12px;color:#817466;margin-top:10px}


.flow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:18px;
  font-size:11px;
  color:#8e8176;
}
.flow .step-current{
  position:relative;
  color:#4e4339;
  font-weight:700;
  padding:0 2px;
}
.flow .step-current::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-6px;
  height:2px;
  border-radius:999px;
  background:#b69570;
}
.flow .step-future{color:#8e8176;font-weight:400}
.flow .arrow{color:#b9afa4}

</style></head><body><main class="wrap">
<div class="flow">
  <span class="step-future">1 入力</span>
  <span class="arrow">→</span>
  <span class="step-current">2 プレビュー</span>
  <span class="arrow">→</span>
  <span class="step-future">3 完成</span>
</div>
<div class="top"><span class="badge">Classic Birthday</span><h1>プレビューを確認</h1></div>
<div class="tabs"><button id="tv" class="on">ボイスページ</button><button id="tm">メッセージカード</button></div>
<section id="pv" class="pane on"><div class="caption">受け取った人がスマホで見るページ</div><div class="voiceFrameWrap"><iframe id="voiceFrame" src="classic-birthday-voice.html" title="Classic Birthday ボイスページ"></iframe></div></section>
<section id="pm" class="pane"><div class="caption">写真・メッセージ・QRを載せて贈るカード（プレビューではQR枠のみ）</div><div class="canvasWrap"><canvas id="card" width="1060" height="1484"></canvas></div></section>
<div class="actions"><button onclick="history.back()">入力を修正</button><button class="buy" onclick="alert('決済は次の実装段階です。完成版は480円（税込）です。')">完成版へ　480円</button></div>
<div class="price">閲覧・ダウンロード期限：購入日から1年間</div>
</main>
<script>
const $=id=>document.getElementById(id);
window.addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  if(!e.data || e.data.type!=='koefoto-voice-height')return;
  const frame=$('voiceFrame');
  if(frame && Number.isFinite(e.data.height)){
    frame.style.height=Math.max(100,e.data.height)+'px';
  }
});
$('tv').onclick=()=>{$('tv').classList.add('on');$('tm').classList.remove('on');$('pv').classList.add('on');$('pm').classList.remove('on')};
$('tm').onclick=()=>{$('tm').classList.add('on');$('tv').classList.remove('on');$('pm').classList.add('on');$('pv').classList.remove('on')};
function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){const x=await db();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}

  function fitCanvasName(ctx,text,fontFamily,fontWeight,maxPx,minPx,maxWidth){
    let lo=minPx, hi=maxPx, best=minPx;
    for(let i=0;i<18;i++){
      const px=(lo+hi)/2;
      ctx.font=fontWeight+' '+px+'px '+fontFamily;
      if(ctx.measureText(text).width<=maxWidth){best=px;lo=px}else{hi=px}
    }
    ctx.font=fontWeight+' '+best.toFixed(1)+'px '+fontFamily;
    return best;
  }

function wrap(ctx,text,maxWidth){let lines=[],cur='';for(const ch of text){if(ctx.measureText(cur+ch).width<=maxWidth)cur+=ch;else{lines.push(cur);cur=ch}}if(cur)lines.push(cur);return lines}
(async()=>{
  const draft=JSON.parse(sessionStorage.getItem('koephoto-draft')||'{}');
  if(!draft.message){alert('作成データがありません。入力画面に戻ります。');location.href='index.html';return}
  const photo=await get('photo');
  const pu=URL.createObjectURL(photo);
  const c=$('card'),ctx=c.getContext('2d');
  const base=new Image();base.src='classic-birthday-message.png';await base.decode();
  ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(base,0,0,c.width,c.height);
  const img=new Image();img.src=pu;await img.decode();

  // 新しい写真枠。写真位置・形は固定。
  const p1={x:48,y:334},p2={x:989,y:286},p3={x:1012,y:854},p4={x:70,y:902};
  const minX=Math.min(p1.x,p2.x,p3.x,p4.x),maxX=Math.max(p1.x,p2.x,p3.x,p4.x);
  const minY=Math.min(p1.y,p2.y,p3.y,p4.y),maxY=Math.max(p1.y,p2.y,p3.y,p4.y);
  const fw=maxX-minX,fh=maxY-minY,ir=img.width/img.height,fr=fw/fh;
  let sx=0,sy=0,sw=img.width,sh=img.height;
  if(ir>fr){sw=img.height*fr;sx=(img.width-sw)/2}else{sh=img.width/fr;sy=(img.height-sh)/2}
  ctx.save();ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.clip();
  ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);ctx.restore();

  // 花リボン・左下ハート等を写真より前面に重ねる。
  const decor=new Image();decor.src='classic-birthday-decor-overlay.png';await decor.decode();ctx.drawImage(decor,0,0,c.width,c.height);

  // To欄：名前のみHTML/Canvas側で表示。「へ」は付けない。
  const recipient=[...(draft.recipient||'')].slice(0,15).join('');
  ctx.fillStyle='#0b347f';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  fitCanvasName(
    ctx,recipient,
    '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',
    '600',34,14,455
  );
  ctx.fillText(recipient,548,252);

  // MESSAGE本文：最大5行、自動縮小。
  ctx.textAlign='left';ctx.fillStyle='#46515c';
  const rules=[1011,1060,1108,1157,1207],maxw=480;let size=(draft.message||'').length<=35?34:(draft.message||'').length<=65?31:28,lines=[];
  while(size>=24){ctx.font='500 '+size+'px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';lines=wrap(ctx,draft.message||'',maxw);if(lines.length<=5)break;size--}
  lines.slice(0,5).forEach((line,i)=>ctx.fillText(line,120,rules[i]-6));

  // FROM欄：贈り主名。
  const sender=[...(draft.sender||'')].slice(0,15).join('');
  ctx.fillStyle='#123d7a';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  fitCanvasName(
    ctx,sender,
    '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',
    '600',29,13,310
  );
  ctx.fillText(sender,400,1265);

  // プレビューではQRを生成しない。実QRは完成版で差し込む。
  ctx.fillStyle='#9b8e7c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='24px "Hiragino Sans","Yu Gothic",sans-serif';ctx.fillText('QRコード',847,1086);

  // 期限は背景画像ではなくプログラム側で表示。
  ctx.textBaseline='alphabetic';ctx.textAlign='center';ctx.font='18px "Hiragino Sans","Yu Gothic",sans-serif';ctx.fillText('閲覧・ダウンロード期限',847,1224);ctx.fillText('購入日から1年間',847,1248);ctx.textAlign='left';
})();
</script></body></html>
