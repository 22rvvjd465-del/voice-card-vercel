<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト | Classic Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--card-w:min(100vw,540px);--navy:#0b347f;--paper:#fbf7ee;--ink:#2d2a25}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 32px}
.card{position:relative;width:var(--card-w);aspect-ratio:1060/1484;overflow:hidden;background:var(--paper);box-shadow:none}
.photo{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:transparent}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;pointer-events:none}
.recipient,.sender{position:absolute;z-index:4;color:var(--navy);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
.recipient{left:31.887%;width:39.811%;top:18.329%;padding:0 3px;transform:translateY(calc(-100% + 1.6px));font-size:clamp(15px,3.5vw,22px)}
.sender{left:39.717%;width:30.755%;top:83.356%;padding:0 3px;transform:translateY(calc(-100% + 1.6px));font-size:clamp(14px,3.2vw,21px)}
.player{position:absolute;z-index:4;left:11.13%;top:70.35%;width:77.83%;height:7.41%;display:grid;grid-template-columns:34px 1fr;align-items:center;column-gap:14px;padding:8px 26px 10px 28px;transform:translateY(-3px)}
.play{width:34px;height:34px;border:0;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0;-webkit-tap-highlight-color:transparent;transform:translateY(-2px)}
.track{min-width:0;align-self:center}
.seek{--progress:0%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;margin:0;background:transparent;cursor:pointer}
.seek::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(to right,var(--navy) 0 var(--progress),#d6c7ae var(--progress) 100%)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-4.5px;background:#fff;border:2px solid var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seek::-moz-range-track{height:3px;border-radius:999px;background:#d6c7ae}
.seek::-moz-range-progress{height:3px;border-radius:999px;background:var(--navy)}
.seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.time{margin-top:-1px;font-size:11px;line-height:1;color:#756a5b;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.brand{width:var(--card-w);text-align:center;padding-top:18px;line-height:1.25}
.brand-name{font-size:18px;font-weight:900;letter-spacing:.08em;color:#5b4b3f}
.tagline{margin-top:5px;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.18em;color:#746c62}


.save-area{
  width:var(--card-w);
  display:flex;
  justify-content:center;
  padding:12px 16px 2px;
}
.save-btn{
  width:min(100%,360px);
  min-height:50px;
  border:1px solid #d7c7b4;
  border-radius:16px;
  background:#fffdf9;
  color:#55493f;
  font:700 14px/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  letter-spacing:.02em;
  box-shadow:0 5px 14px rgba(70,55,40,.07);
  -webkit-tap-highlight-color:transparent;
}
.save-btn:active{transform:translateY(1px)}
.save-btn[disabled]{opacity:.55}


.save-sheet-backdrop{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(31,25,20,.30);
  padding:18px;
}
.save-sheet{
  width:min(100%,440px);
  border-radius:22px;
  background:#fff;
  box-shadow:0 18px 50px rgba(0,0,0,.18);
  padding:18px;
}
.save-sheet-title{
  margin:1px 0 5px;
  text-align:center;
  font-size:17px;font-weight:800;color:#4f4339;
}
.save-sheet-note{
  margin:0 0 14px;
  text-align:center;
  font-size:12px;line-height:1.6;color:#827568;
}
.save-option{
  width:100%;
  min-height:58px;
  border:1px solid #ded1c1;
  border-radius:15px;
  background:#fffdf9;
  color:#4d4238;
  text-align:left;
  padding:10px 14px;
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}
.save-option strong{display:block;font-size:14px}
.save-option span{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:#8b7e70}
.save-option[disabled]{opacity:.48}
.save-cancel{
  width:100%;border:0;background:transparent;
  margin-top:10px;padding:10px;
  font:700 13px/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#786b5f;
}

.state{width:var(--card-w);min-height:70vh;display:grid;place-items:center;text-align:center;color:#8a7d70;font-size:14px;line-height:1.8}
[hidden]{display:none!important}
@media(max-width:390px){.player{grid-template-columns:30px 1fr;column-gap:10px;padding:8px 20px 10px 22px;transform:translateY(-3px)}.play{width:30px;height:30px;font-size:13px}.time{font-size:10px}}
</style>
</head>
<body>
<main class="page">
  <div id="state" class="state">コエフォトを読み込んでいます…</div>

  <div id="content" hidden style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div id="voiceSaveTarget" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <section class="card" aria-label="Classic Birthday ボイスカード">
      <canvas id="photoCanvas" class="photo" width="1060" height="1484" aria-label="贈られた写真"></canvas>
      <img class="art" src="koefoto_classic_birthday_overlay.png" alt="">
      <div id="recipient" class="recipient"></div>
      <div class="player">
        <button class="play" id="playBtn" aria-label="再生">▶</button>
        <div class="track">
          <input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
          <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>
      <div id="sender" class="sender"></div>
      <audio id="audio" preload="metadata" playsinline></audio>
    </section>
    <footer class="brand">
      <div class="brand-name">コエフォト</div>
      <div class="tagline">A PHOTO, A VOICE, A MEMORY.</div>
    </footer>
    </div>
    <div class="save-area">
      <button id="saveVoicePage" class="save-btn" type="button">思い出を保存</button>
    </div>
  </div>

  <div id="saveSheet" class="save-sheet-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="saveSheetTitle">
    <div class="save-sheet">
      <div id="saveSheetTitle" class="save-sheet-title">保存方法を選ぶ</div>
      <p class="save-sheet-note">プレーヤー付き保存なら、1年後もファイルから声を再生できます。</p>
      <button id="saveHtml" class="save-option" type="button">
        <strong>プレーヤー付きで保存（HTML）</strong>
        <span>写真・デザイン・音声・再生ボタンを1つのファイルにまとめて保存</span>
      </button>
      <button class="save-option" type="button" disabled aria-disabled="true" style="margin-top:10px">
        <strong>動画で保存（MP4）</strong>
        <span>次の段階で追加します</span>
      </button>
      <button id="saveCancel" class="save-cancel" type="button">キャンセル</button>
    </div>
  </div>

</main>

<script>
const SUPABASE='https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/voice-card-public';
const $=id=>document.getElementById(id);
const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,'0')}`};

function fail(msg){
  $('state').textContent=msg;
  $('state').style.color='#9b5148';
}
function fitName(el,maxCanvasWidth,maxCanvasPx=40,minCanvasPx=14){
  const card=document.querySelector('.card');
  if(!card||!el)return;
  const scale=card.getBoundingClientRect().width/1060;
  const available=maxCanvasWidth*scale;
  let low=minCanvasPx*scale,high=maxCanvasPx*scale,best=low;
  const measure=document.createElement('span');
  const cs=getComputedStyle(el);
  measure.textContent=el.textContent;
  measure.style.cssText='position:fixed;left:-10000px;top:-10000px;visibility:hidden;white-space:nowrap';
  measure.style.fontFamily=cs.fontFamily;
  measure.style.fontWeight=cs.fontWeight;
  document.body.appendChild(measure);
  for(let i=0;i<18;i++){
    const size=(low+high)/2;
    measure.style.fontSize=size+'px';
    if(measure.getBoundingClientRect().width<=available){best=size;low=size}else high=size;
  }
  measure.remove();
  el.style.fontSize=best.toFixed(1)+'px';
}
async function renderPhoto(d){
  const img=new Image();
  img.crossOrigin='anonymous';
  await new Promise((resolve,reject)=>{
    img.onload=()=>resolve();
    img.onerror=()=>reject(new Error('photo load error'));
    img.src=d.photo_url + (d.photo_url.includes('?') ? '&' : '?') + 't=' + Date.now();
  });

  const c=$('photoCanvas'),ctx=c.getContext('2d');
  const frame=[
    {x:36.3,y:322.25},
    {x:1017.58,y:300.26},
    {x:1029.80,y:863.73},
    {x:48.02,y:883.88}
  ];
  const cx=frame.reduce((s,p)=>s+p.x,0)/4;
  const cy=frame.reduce((s,p)=>s+p.y,0)/4;
  const scale=.972;
  const pts=frame.map(p=>({x:cx+(p.x-cx)*scale,y:cy+(p.y-cy)*scale}));
  const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x));
  const minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
  const fw=maxX-minX,fh=maxY-minY,ir=img.width/img.height,fr=fw/fh;

  let baseSw=img.width,baseSh=img.height;
  if(ir>fr) baseSw=img.height*fr;
  else baseSh=img.width/fr;

  const zoom=Math.min(2.5,Math.max(1,Number(d.photo_zoom)||1));
  const fx=Math.min(1,Math.max(0,Number(d.photo_focus_x)||.5));
  const fy=Math.min(1,Math.max(0,Number(d.photo_focus_y)||.5));
  const sw=baseSw/zoom,sh=baseSh/zoom;
  const sx=(img.width-sw)>0.5?(img.width-sw)*fx:0;
  const sy=(img.height-sh)>0.5?(img.height-sh)*fy:0;

  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  ctx.lineTo(pts[1].x,pts[1].y);
  ctx.lineTo(pts[2].x,pts[2].y);
  ctx.lineTo(pts[3].x,pts[3].y);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);
  ctx.restore();
}
function setupAudio(url){
  const audio=$('audio'),btn=$('playBtn'),seek=$('seek'),cur=$('cur'),dur=$('dur');
  audio.src=url;
  btn.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause()};
  audio.onplay=()=>btn.textContent='❚❚';
  audio.onpause=()=>btn.textContent='▶';
  function sync(){
    const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;
    seek.value=pct;
    seek.style.setProperty('--progress',pct+'%');
    cur.textContent=fmt(audio.currentTime);
  }
  audio.onloadedmetadata=()=>{dur.textContent=fmt(audio.duration);sync()};
  audio.ondurationchange=()=>{dur.textContent=fmt(audio.duration);sync()};
  audio.ontimeupdate=sync;
  audio.onended=()=>{btn.textContent='▶';audio.currentTime=0;sync()};
  seek.oninput=()=>{if(audio.duration){audio.currentTime=(Number(seek.value)/100)*audio.duration;sync()}};
}
function loadDataScript(id){
  return new Promise((resolve,reject)=>{
    window.__KOEPHOTO_DATA__=null;
    const timeout=setTimeout(()=>reject(new Error('data timeout')),10000);
    const done=()=>{
      if(!window.__KOEPHOTO_DATA__)return;
      clearTimeout(timeout);
      window.removeEventListener('koephoto-data',done);
      resolve(window.__KOEPHOTO_DATA__);
    };
    window.addEventListener('koephoto-data',done);
    const sc=document.createElement('script');
    sc.src=`${SUPABASE}?id=${encodeURIComponent(id)}&format=js&t=${Date.now()}`;
    sc.async=true;
    sc.onerror=()=>{
      clearTimeout(timeout);
      window.removeEventListener('koephoto-data',done);
      reject(new Error('data script failed'));
    };
    document.head.appendChild(sc);
  });
}



let currentCardData=null;

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error||new Error('FileReader failed'));
    r.readAsDataURL(blob);
  });
}
async function fetchAsDataURL(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error(`asset fetch failed: ${res.status}`);
  return blobToDataURL(await res.blob());
}
function escText(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
async function buildOfflineHtml(){
  if(!currentCardData)throw new Error('card data is not ready');

  // The photo is already rendered with the exact crop/zoom into this canvas.
  const photoData=$('photoCanvas').toDataURL('image/png');
  const overlayData=await fetchAsDataURL('koefoto_classic_birthday_overlay.png');
  const audioData=await fetchAsDataURL(currentCardData.audio_url);

  const recipient=escText([...(currentCardData.recipient||'')].slice(0,15).join(''));
  const sender=escText([...(currentCardData.sender||'')].slice(0,15).join(''));

  return `<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト | 保存版</title>
<style>
:root{--card-w:min(100vw,540px);--navy:#0b347f;--paper:#fbf7ee;--ink:#2d2a25}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom))}
.unit{width:100%;display:flex;flex-direction:column;align-items:center}
.card{position:relative;width:var(--card-w);aspect-ratio:1060/1484;overflow:hidden;background:var(--paper)}
.photo,.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.photo{z-index:1}.art{z-index:3;pointer-events:none}
.recipient,.sender{position:absolute;z-index:4;color:var(--navy);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-align:center}
.recipient{left:31.887%;width:39.811%;top:18.329%;padding:0 3px;transform:translateY(calc(-100% + 1.6px));font-size:clamp(15px,3.5vw,22px)}
.sender{left:39.717%;width:30.755%;top:83.356%;padding:0 3px;transform:translateY(calc(-100% + 1.6px));font-size:clamp(14px,3.2vw,21px)}
.player{position:absolute;z-index:4;left:11.13%;top:70.35%;width:77.83%;height:7.41%;display:grid;grid-template-columns:34px 1fr;align-items:center;column-gap:14px;padding:8px 26px 10px 28px;transform:translateY(-3px)}
.play{width:34px;height:34px;border:0;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer;padding:0;transform:translateY(-2px)}
.track{min-width:0}.seek{--progress:0%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;margin:0;background:transparent}
.seek::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(to right,var(--navy) 0 var(--progress),#d6c7ae var(--progress) 100%)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-4.5px;background:#fff;border:2px solid var(--navy)}
.time{margin-top:-1px;font-size:11px;line-height:1;color:#756a5b;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.brand{width:var(--card-w);text-align:center;padding-top:18px;line-height:1.25}
.brand-name{font-size:18px;font-weight:900;letter-spacing:.08em;color:#5b4b3f}
.tagline{margin-top:5px;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.18em;color:#746c62}
@media(max-width:390px){.player{grid-template-columns:30px 1fr;column-gap:10px;padding:8px 20px 10px 22px}.play{width:30px;height:30px;font-size:13px}.time{font-size:10px}}
</style>
</head>
<body>
<main class="page">
<div class="unit">
<section class="card">
<img class="photo" src="${photoData}" alt="贈られた写真">
<img class="art" src="${overlayData}" alt="">
<div class="recipient">${recipient}</div>
<div class="player">
<button class="play" id="play" type="button" aria-label="再生">▶</button>
<div class="track">
<input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">

</div>
</div>

</section>
<footer class="brand"><div class="brand-name">コエフォト</div><div class="tagline">A PHOTO, A VOICE, A MEMORY.</div></footer>
</div>
</main>
<script>
const a=document.getElementById('audio'),b=document.getElementById('play'),s=document.getElementById('seek'),c=document.getElementById('cur'),d=document.getElementById('dur');
const f=x=>{if(!Number.isFinite(x))return'0:00';const m=Math.floor(x/60),q=Math.floor(x%60);return m+':'+String(q).padStart(2,'0')};
function sync(){const p=a.duration?(a.currentTime/a.duration)*100:0;s.value=p;s.style.setProperty('--progress',p+'%');c.textContent=f(a.currentTime)}
b.onclick=async()=>{if(a.paused){try{await a.play()}catch(e){}}else a.pause()};
a.onplay=()=>b.textContent='❚❚';a.onpause=()=>b.textContent='▶';
a.onloadedmetadata=()=>{d.textContent=f(a.duration);sync()};a.ondurationchange=()=>{d.textContent=f(a.duration);sync()};a.ontimeupdate=sync;
a.onended=()=>{b.textContent='▶';a.currentTime=0;sync()};s.oninput=()=>{if(a.duration){a.currentTime=(Number(s.value)/100)*a.duration;sync()}};
<\/script>
</body>
</html>`;
}
async function saveOfflineHtml(){
  const btn=$('saveHtml');
  const original=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<strong>保存版を作成しています…</strong><span>写真と音声を1つのファイルにまとめています</span>';
  try{
    const htmlText=await buildOfflineHtml();
    const blob=new Blob([htmlText],{type:'text/html;charset=utf-8'});
    const file=new File([blob],'koephoto-player.html',{type:'text/html'});

    // iPhone/iPad: share sheet lets the user save the .html file to Files.
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'コエフォト 保存版'});
        return;
      }catch(e){
        if(e && e.name==='AbortError')return;
      }
    }

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='koephoto-player.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){
    console.error('offline html export',e);
    alert('プレーヤー付き保存版を作成できませんでした。もう一度お試しください。');
  }finally{
    btn.disabled=false;
    btn.innerHTML=original;
    $('saveSheet').hidden=true;
  }
}

$('saveVoicePage').addEventListener('click',()=>{$('saveSheet').hidden=false});
$('saveCancel').addEventListener('click',()=>{$('saveSheet').hidden=true});
$('saveSheet').addEventListener('click',e=>{if(e.target===$('saveSheet'))$('saveSheet').hidden=true});
$('saveHtml').addEventListener('click',saveOfflineHtml);

(async()=>{
  const id=new URLSearchParams(location.search).get('id')||'';
  if(!/^[0-9a-f-]{36}$/i.test(id)){fail('このコエフォトは表示できません。');return}
  try{
    const d=await loadDataScript(id);
    currentCardData=d;
    $('recipient').textContent=[...(d.recipient||'')].slice(0,15).join('');
    $('sender').textContent=[...(d.sender||'')].slice(0,15).join('');

    try{
      await renderPhoto(d);
    }catch(e){
      console.error('photo',e);
      // SafariでCanvas描画だけ失敗した場合は、まず画像自体を表示して受け取りを止めない。
      const c=$('photoCanvas');
      c.style.display='none';
      const fallback=document.createElement('img');
      fallback.src=d.photo_url + (d.photo_url.includes('?') ? '&' : '?') + 't=' + Date.now();
      fallback.alt='贈られた写真';
      fallback.style.position='absolute';
