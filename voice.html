:root{--card-w:min(100vw,540px);--navy:#0b347f;--paper:#fbf7ee;--ink:#2d2a25}

html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 32px}
.card{position:relative;width:var(--card-w);aspect-ratio:1060/1484;overflow:hidden;background:var(--paper);box-shadow:none}
.photo{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:transparent}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;pointer-events:none}

.sender{left:39.717%;width:30.755%;top:83.356%;padding:0 3px;transform:translateY(calc(-100% + 1.6px));font-size:clamp(14px,3.2vw,21px)}
.player{position:absolute;z-index:4;left:11.13%;top:70.35%;width:77.83%;height:7.41%;display:grid;grid-template-columns:34px 1fr;align-items:center;column-gap:14px;padding:8px 26px 10px 28px;transform:translateY(-3px)}

<script>
const SUPABASE='https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/voice-card-public';
const $=id=>document.getElementById(id);
const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,'0')}`};

function fail(msg){
  $('state').textContent=msg;
  $('state').style.color='#9b5148';
}
function fitName(el,maxCanvasWidth,maxCanvasPx=40,minCanvasPx=14){
  const card=document.querySelector('.card');
  if(!card||!el)return;
  const scale=card.getBoundingClientRect().width/1060;
  const available=maxCanvasWidth*scale;
  let low=minCanvasPx*scale,high=maxCanvasPx*scale,best=low;
  const measure=document.createElement('span');
  const cs=getComputedStyle(el);
  measure.textContent=el.textContent;
  measure.style.cssText='position:fixed;left:-10000px;top:-10000px;visibility:hidden;white-space:nowrap';
  measure.style.fontFamily=cs.fontFamily;
  measure.style.fontWeight=cs.fontWeight;
  document.body.appendChild(measure);
  for(let i=0;i<18;i++){
    const size=(low+high)/2;
    measure.style.fontSize=size+'px';
    if(measure.getBoundingClientRect().width<=available){best=size;low=size}else high=size;
  }
  measure.remove();
  el.style.fontSize=best.toFixed(1)+'px';
}
async function renderPhoto(d){
  const img=new Image();
  img.crossOrigin='anonymous';
  await new Promise((resolve,reject)=>{
    img.onload=()=>resolve();
    img.onerror=()=>reject(new Error('photo load error'));
    img.src=d.photo_url + (d.photo_url.includes('?') ? '&' : '?') + 't=' + Date.now();
  });

  const c=$('photoCanvas'),ctx=c.getContext('2d');
  const frame=[
    {x:36.3,y:322.25},
    {x:1017.58,y:300.26},
    {x:1029.80,y:863.73},
    {x:48.02,y:883.88}
  ];
  const cx=frame.reduce((s,p)=>s+p.x,0)/4;
  const cy=frame.reduce((s,p)=>s+p.y,0)/4;
  const scale=.972;
  const pts=frame.map(p=>({x:cx+(p.x-cx)*scale,y:cy+(p.y-cy)*scale}));
  const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x));
  const minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
  const fw=maxX-minX,fh=maxY-minY,ir=img.width/img.height,fr=fw/fh;

  let baseSw=img.width,baseSh=img.height;
  if(ir>fr) baseSw=img.height*fr;
  else baseSh=img.width/fr;

  const zoom=Math.min(2.5,Math.max(1,Number(d.photo_zoom)||1));
  const fx=Math.min(1,Math.max(0,Number(d.photo_focus_x)||.5));
  const fy=Math.min(1,Math.max(0,Number(d.photo_focus_y)||.5));
  const sw=baseSw/zoom,sh=baseSh/zoom;
  const sx=(img.width-sw)>0.5?(img.width-sw)*fx:0;
  const sy=(img.height-sh)>0.5?(img.height-sh)*fy:0;

  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  ctx.lineTo(pts[1].x,pts[1].y);
  ctx.lineTo(pts[2].x,pts[2].y);
  ctx.lineTo(pts[3].x,pts[3].y);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);
  ctx.restore();
}
function setupAudio(url){
  const audio=$('audio'),btn=$('playBtn'),seek=$('seek'),cur=$('cur'),dur=$('dur');
  audio.src=url;
  btn.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause()};
  audio.onplay=()=>btn.textContent='❚❚';
  audio.onpause=()=>btn.textContent='▶';
  function sync(){
    const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;
    seek.value=pct;
    seek.style.setProperty('--progress',pct+'%');
    cur.textContent=fmt(audio.currentTime);
  }
  audio.onloadedmetadata=()=>{dur.textContent=fmt(audio.duration);sync()};
  audio.ondurationchange=()=>{dur.textContent=fmt(audio.duration);sync()};
  audio.ontimeupdate=sync;
  audio.onended=()=>{btn.textContent='▶';audio.currentTime=0;sync()};
  seek.oninput=()=>{if(audio.duration){audio.currentTime=(Number(seek.value)/100)*audio.duration;sync()}};
}
function loadDataScript(id){
  return new Promise((resolve,reject)=>{
    window.__KOEPHOTO_DATA__=null;
    const timeout=setTimeout(()=>reject(new Error('data timeout')),10000);
    const done=()=>{
      if(!window.__KOEPHOTO_DATA__)return;
      clearTimeout(timeout);
      window.removeEventListener('koephoto-data',done);
      resolve(window.__KOEPHOTO_DATA__);
    };
    window.addEventListener('koephoto-data',done);
    const sc=document.createElement('script');
    sc.src=`${SUPABASE}?id=${encodeURIComponent(id)}&format=js&t=${Date.now()}`;
    sc.async=true;
    sc.onerror=()=>{
      clearTimeout(timeout);
      window.removeEventListener('koephoto-data',done);
      reject(new Error('data script failed'));
    };
    document.head.appendChild(sc);
  });
}

function canvasToBlob(canvas,type='image/png',quality=1){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(b=>b?resolve(b):reject(new Error('canvas export failed')),type,quality);
  });
}
async function fetchBlob(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error(`asset fetch failed: ${res.status}`);
  return await res.blob();
}
async function imageFromBlob(blob){
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=()=>reject(new Error('image decode failed'));
      img.src=url;
    });
    return img;
  }finally{
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
}

}

async function buildEpubBlob(){
  if(!window.JSZip)throw new Error('JSZip is not available');
  if(!currentCardData)throw new Error('card data is not ready');

  await document.fonts.ready;

  const overlayBlob=await fetchBlob('koefoto_classic_birthday_overlay.png');
  const overlayImg=await imageFromBlob(overlayBlob);
  const audioBlob=await fetchBlob(currentCardData.audio_url);

  // Build one visual card image using the *actual rendered web-page font*.
  // This keeps recipient/sender typography identical inside Apple Books,
  // without depending on fonts installed in Books.
  const composed=document.createElement('canvas');
  composed.width=1060;
  composed.height=1484;
  const cx=composed.getContext('2d');
  cx.drawImage($('photoCanvas'),0,0,1060,1484);
  cx.drawImage(overlayImg,0,0,1060,1484);

  const cardRect=document.querySelector('.card').getBoundingClientRect();
  const scaleToCanvas=1060/cardRect.width;
  function drawRenderedName(el){
    const cs=getComputedStyle(el);
    const r=el.getBoundingClientRect();
    const x=(r.left-cardRect.left+r.width/2)*scaleToCanvas;
    // Canvas text uses alphabetic baseline; visually align to the DOM box center.
    const fontPx=parseFloat(cs.fontSize)*scaleToCanvas;
    const y=(r.top-cardRect.top+r.height/2)*scaleToCanvas + fontPx*0.34;
    cx.save();
    cx.fillStyle=cs.color || '#0b347f';
    cx.textAlign='center';
    cx.textBaseline='alphabetic';
    cx.font=`${cs.fontWeight} ${fontPx}px ${cs.fontFamily}`;
    cx.fillText(el.textContent||'',x,y);
    cx.restore();
  }
  drawRenderedName($('recipient'));
  drawRenderedName($('sender'));
  const cardBlob=await canvasToBlob(composed,'image/png',1);

  const purchaseId=String(currentCardData.purchase_id||'').trim();
  const publicId=String(currentCardData.public_id||new URLSearchParams(location.search).get('id')||'').trim();
  const uniqueKey=(purchaseId||publicId||('KF-'+Date.now())).replace(/[^A-Za-z0-9_-]/g,'');
  const zip=new JSZip();

  // EPUB requires mimetype to be the first entry and stored without compression.
  zip.file('mimetype','application/epub+zip',{compression:'STORE'});

  zip.file('META-INF/container.xml',`<?xml version="1.0" encoding="UTF-8"?>

  </rootfiles>
</container>`);

(function(){
  var a=document.getElementById('audio');
  var b=document.getElementById('play');
  var s=document.getElementById('seek');
  var c=document.getElementById('cur');
  var d=document.getElementById('dur');
  function fmt(x){
    if(!isFinite(x))return '0:00';
    var m=Math.floor(x/60),q=Math.floor(x%60);
    return m+':'+(q<10?'0':'')+q;
  }
  function sync(){
    var p=a.duration?(a.currentTime/a.duration)*100:0;
    s.value=p;
    s.style.setProperty('--progress',p+'%');
    c.textContent=fmt(a.currentTime);
  }
  b.addEventListener('click',function(){
    if(a.paused){a.play();}else{a.pause();}
  });
  a.addEventListener('play',function(){b.textContent='❚❚';});
  a.addEventListener('pause',function(){b.textContent='▶';});
  a.addEventListener('loadedmetadata',function(){d.textContent=fmt(a.duration);sync();});
  a.addEventListener('durationchange',function(){d.textContent=fmt(a.duration);sync();});
  a.addEventListener('timeupdate',sync);
  a.addEventListener('ended',function(){b.textContent='▶';a.currentTime=0;sync();});
  s.addEventListener('input',function(){
    if(a.duration){a.currentTime=(Number(s.value)/100)*a.duration;sync();}
  });
})();`);
