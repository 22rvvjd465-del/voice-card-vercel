<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday｜コエフォト</title>
<style>
:root{--navy:#0b477d;--gold:#bb8e3c;--ivory:#faf6ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5efe6}
.web{min-height:100svh;padding:14px 8px 26px}
.card{
 position:relative;width:min(600px,100%);aspect-ratio:2/3;margin:auto;
 overflow:hidden;background:var(--ivory);box-shadow:0 12px 32px #5b493329
}
.bg{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* Exact inner area of the skewed gold photo frame.
   The four points are based on the fixed 1024x1536 template geometry. */
.photo{
 position:absolute;z-index:2;
 left:7.91%;top:22.92%;width:85.45%;height:34.38%;
 overflow:hidden;
 clip-path:polygon(0.35% 1.15%,98.75% 0%,100% 96.65%,1.55% 100%);
 background:#eee7dc
}
.photo img{
 width:100%;height:100%;display:block;
 object-fit:cover;
 object-position:50% 50%;
}

/* SAME bouquet/ribbon artwork extracted from the message-card template. */
.flower{
 position:absolute;z-index:6;
 right:1.6%;top:1.0%;width:24.7%;height:auto;
 display:block;pointer-events:none
}

/* Functional button completely covers the printed/static button underneath. */
.play{
 position:absolute;z-index:8;
 left:10.8%;top:65.15%;width:12.8%;aspect-ratio:1;
 border:0;border-radius:50%;background:var(--navy);
 display:grid;place-items:center;padding:0;
 box-shadow:0 1px 1px rgba(0,0,0,.08);
 cursor:pointer;-webkit-tap-highlight-color:transparent
}
.playIcon{
 width:0;height:0;margin-left:6%;
 border-top:0.95em solid transparent;
 border-bottom:0.95em solid transparent;
 border-left:1.35em solid white
}
.play.playing .playIcon{
 width:1.15em;height:1.55em;margin-left:0;border:0;
 background:linear-gradient(to right,#fff 0 34%,transparent 34% 66%,#fff 66% 100%)
}
.track{
 position:absolute;z-index:9;
 left:29.45%;top:68.08%;width:38.35%;height:3px;
 border-radius:99px;overflow:hidden;pointer-events:none
}
.fill{width:0;height:100%;background:var(--navy);border-radius:99px}
.time{
 position:absolute;z-index:9;
 left:70.1%;top:66.30%;width:15.2%;height:4%;
 display:flex;align-items:center;justify-content:center;background:#fbf8f0;
 color:#8290a4;font-size:clamp(8px,2.1vw,14px);
 font-variant-numeric:tabular-nums;pointer-events:none
}

/* Existing gold underline is y=1242/1536=80.86%.
   Name bottom is placed just 5px above it. */
.sender{
 position:absolute;z-index:9;
 left:30.9%;top:78.25%;width:46.6%;height:2.25%;
 display:flex;align-items:flex-end;justify-content:center;
 padding:0 2% 0.15%;
 color:#9a763b;font-size:clamp(12px,3.3vw,22px);font-weight:500;
 line-height:1;white-space:nowrap;overflow:hidden
}
audio{display:none}

.brand{width:min(600px,100%);margin:0 auto;text-align:center;padding:17px 8px 0}
.brandname{font-size:15px;font-weight:700;letter-spacing:.08em;color:#173f69}
.tag{margin-top:6px;font:10px Georgia,"Times New Roman",serif;letter-spacing:.18em;color:#9a8c79}
@media(max-width:420px){
 .web{padding:8px 6px 22px}
 .brand{padding-top:14px}
 .brandname{font-size:14px}
 .tag{font-size:9px;letter-spacing:.13em}
}
</style>
</head>
<body>
<main class="web">
<section class="card" aria-label="Classic Birthday ボイスページ">
 <img class="bg" src="classic-birthday-voice-v9-bg.png" alt="">
 <div class="photo"><img id="photo" alt=""></div>
 <img class="flower" src="classic-birthday-flower-messagecard.png" alt="">
 <button class="play" id="play" type="button" aria-label="音声を再生"><span class="playIcon"></span></button>
 <div class="track"><div class="fill" id="fill"></div></div>
 <div class="time" id="time">0:00 / --:--</div>
 <div class="sender" id="sender"></div>
 <audio id="audio" preload="metadata"></audio>
</section>
<footer class="brand">
 <div class="brandname">コエフォト</div>
 <div class="tag">A PHOTO, A VOICE, A MEMORY.</div>
</footer>
</main>
<script>
function openDB(){return new Promise((ok,ng)=>{
 const r=indexedDB.open("koephoto-preview",2);
 r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)
})}
async function getBlob(k){
 const x=await openDB();
 const v=await new Promise((ok,ng)=>{
  const t=x.transaction("draft");const r=t.objectStore("draft").get(k);
  r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)
 });
 x.close();return v
}
function fmt(s){
 if(!Number.isFinite(s))return"--:--";
 s=Math.max(0,Math.floor(s));
 return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")
}
(async()=>{
 const d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");
 document.getElementById("sender").textContent=d.sender||"";
 const p=await getBlob("photo"),a=await getBlob("audio");
 if(p)document.getElementById("photo").src=URL.createObjectURL(p);
 if(a)document.getElementById("audio").src=URL.createObjectURL(a);
})();
const audio=document.getElementById("audio"),play=document.getElementById("play"),
 fill=document.getElementById("fill"),time=document.getElementById("time");
function upd(){
 time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
 fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%"
}
play.addEventListener("click",async()=>{
 if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause()
});
audio.addEventListener("play",()=>{
 play.classList.add("playing");play.setAttribute("aria-label","音声を一時停止")
});
audio.addEventListener("pause",()=>{
 play.classList.remove("playing");play.setAttribute("aria-label","音声を再生")
});
audio.addEventListener("loadedmetadata",upd);
audio.addEventListener("durationchange",upd);
audio.addEventListener("timeupdate",upd);
audio.addEventListener("ended",()=>{audio.currentTime=0;upd()});
</script>
</body>
</html>
