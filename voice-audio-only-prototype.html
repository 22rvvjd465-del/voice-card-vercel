<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コエフォト | Voice Page (design draft)</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#343a39;background:#f5f4f1}*{box-sizing:border-box}body{margin:0}.page{max-width:520px;min-height:100svh;margin:auto;padding:38px 20px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font-size:10px;letter-spacing:.24em;color:#8c8f8c}.panel{width:100%;padding:56px 28px 42px;background:#fff;border:1px solid #e9e8e4;box-shadow:0 15px 40px #33333308;text-align:center}.mark{width:76px;height:76px;border:1px solid #cbd3d1;border-radius:50%;display:grid;place-items:center;margin:0 auto 29px;color:#526c68}.mark svg{width:32px;height:32px}.title{font-family:Georgia,"Yu Mincho",serif;font-weight:400;font-size:25px;letter-spacing:.08em;margin:0 0 12px}.subtitle{font-size:12px;line-height:1.9;color:#7a807d;margin:0 0 46px}.player{display:flex;align-items:center;gap:15px;padding:17px 15px;border:1px solid #e5e8e6;background:#f9faf9;border-radius:8px}.play{border:0;background:#425d58;color:white;border-radius:50%;height:48px;width:48px;flex:none;font-size:19px;cursor:pointer}.timeline{flex:1;min-width:0;text-align:left}.seek{width:100%;accent-color:#425d58;cursor:pointer}.times{display:flex;justify-content:space-between;color:#777;font-size:11px;font-variant-numeric:tabular-nums}.hint{font-size:11px;color:#8a8f8c;margin-top:25px}.brand{margin-top:40px;font-size:13px;letter-spacing:.15em;font-weight:600}.note{font-size:10px;color:#8c8f8c;margin-top:10px;line-height:1.7}.demo{margin-top:20px;font-size:11px;color:#7d8581}.demo input{max-width:230px;font-size:11px}.demo[hidden]{display:none}@media(max-width:390px){.panel{padding:45px 20px 35px}.title{font-size:22px}}
</style></head><body><main class="page"><div class="eyebrow">A VOICE FOR YOU</div><section class="panel"><div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 14v4m5-10v16m5-21v26m5-19v12m5-16v20"/></svg></div><h1 class="title">声の贈りもの</h1><p class="subtitle">あなたへ届いた、大切な声のメッセージ。<br>再生ボタンを押してお聴きください。</p><div class="player"><button class="play" id="play" aria-label="再生" disabled>▶</button><div class="timeline"><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置" disabled><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div></div><p class="hint" id="status" role="status">音声を読み込んでいます</p></section><div class="brand">KOEFOTO</div><p class="note">写真はこのページに送信・表示されません。</p><div class="demo" id="demo" hidden>デザイン確認用：<input type="file" id="sample" accept="audio/*" aria-label="試聴する音声を選択"></div><audio id="audio" preload="metadata"></audio></main>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),status=document.getElementById('status');let objectUrl=null;
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function loadAudio(url){audio.pause();audio.src=url;audio.load();play.disabled=false;seek.disabled=false;status.textContent='再生できます'}
play.onclick=async()=>{try{if(audio.paused)await audio.play();else audio.pause()}catch(e){status.textContent='音声を再生できませんでした'}};
audio.onplay=()=>{play.textContent='Ⅱ';play.setAttribute('aria-label','一時停止')};audio.onpause=()=>{play.textContent='▶';play.setAttribute('aria-label','再生')};
audio.ontimeupdate=()=>{document.getElementById('current').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)seek.value=Math.round(audio.currentTime/audio.duration*1000)};
audio.onloadedmetadata=()=>{document.getElementById('duration').textContent=fmt(audio.duration)};
audio.onerror=()=>{status.textContent='音声を読み込めませんでした';play.disabled=true};
seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(seek.value)/1000};
const demo=new URLSearchParams(location.search).get('demo')==='1';if(demo){document.getElementById('demo').hidden=false;status.textContent='下のファイル選択から音声を試聴できます';document.getElementById('sample').onchange=e=>{const f=e.target.files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);loadAudio(objectUrl)}}
// Integration contract: trusted same-origin parent passes an authorized, short-lived audio URL.
// This draft deliberately does not fetch card data or accept arbitrary query-string audio URLs.
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;if(e.data?.type==='koefoto-audio-source'&&typeof e.data.url==='string'){const u=new URL(e.data.url,location.href);if(u.protocol==='https:'&&u.origin===location.origin)loadAudio(u.href)}});
</script></body></html>
