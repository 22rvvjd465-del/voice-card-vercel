<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コエフォト｜作成</title>
<style>
*{box-sizing:border-box} :root{--bg:#faf7f2;--ink:#5b4b3f;--muted:#8e8176;--line:#d8c7b5;--accent:#9d7f63}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}.brand{font-weight:900;letter-spacing:.08em;font-size:24px;margin:26px 0 0;}
.hero{padding:4px 2px 22px;border-bottom:1px solid var(--line)}h1{font-size:34px;line-height:1.35;margin:10px 0}.hero em{font-style:normal;color:var(--accent)}
.step{display:flex;gap:12px;padding:20px 0;border-bottom:1px solid #e3d7ca}.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#b28f6e;color:#fff;font-size:12px;font-weight:800}.content{width:100%}.content b{display:block;margin-bottom:6px}.field-help{font-size:12px;color:var(--muted);margin:0 0 9px;line-height:1.5}
input,textarea{width:100%;padding:13px 14px;border:1px solid #c7b5a4;border-radius:12px;background:#fffdf9;font:inherit;color:var(--ink)}textarea{min-height:105px;resize:vertical}.count{text-align:right;font-size:11px;color:var(--muted);margin-top:5px}
.upload{display:block;padding:14px;text-align:center;border:1.5px solid #bda58d;background:#fffdf9;border-radius:13px;font-weight:800}.upload input{display:none}.upload-plus{font-size:18px;font-weight:500;vertical-align:-1px;margin-right:3px}
#photoPreview{display:none;width:100%;margin-top:10px;border-radius:12px;max-height:320px;object-fit:cover}audio{display:none;width:100%;margin-top:10px}
.recorder{margin-top:10px}
.voice-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.voice-option{min-height:118px;border:1.5px solid #c8b39e;border-radius:16px;background:#fffdf9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;text-align:center}
.voice-option .icon{font-size:25px;line-height:1;margin-bottom:9px}
.voice-option .title{font-size:14px;font-weight:800;color:var(--ink)}
.voice-option .sub{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.record-btn{appearance:none;width:100%;min-height:118px;padding:14px 10px;border:1.5px solid #c8b39e;border-radius:16px;background:#fffdf9;color:var(--ink);font-size:14px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center}
.record-btn .icon{font-size:25px;line-height:1;margin-bottom:9px}
.record-btn .sub{font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.45;margin-top:4px}
.record-btn.recording{background:#f7ece7;border-color:#c78f7d;color:#8b4e3e}
.record-btn.recording .sub{color:#9e6758}
.record-status{text-align:center;font-size:12px;color:var(--muted);margin-top:9px;min-height:18px}
.record-actions{display:none;margin-top:9px}
.record-actions button{padding:11px 8px;font-size:13px;background:#fffdf9;color:var(--ink);border:1px solid #c7b5a4}
.file-choice{margin:0;text-align:center}
.audio-file-label{cursor:pointer}
.audio-file-label input{display:none}
audio{display:none;width:100%;margin-top:10px}
@media(max-width:390px){.voice-options{gap:8px}.voice-option,.record-btn{min-height:112px;padding:12px 8px}.voice-option .title,.record-btn{font-size:13px}}
.consent{display:flex;gap:9px;font-size:12px;line-height:1.65;margin:20px 0;padding:13px;background:#f3ede5;border-radius:14px}.consent input{width:auto}
button{width:100%;padding:16px;border:0;border-radius:14px;background:#9f8064;color:#fff;font-size:16px;font-weight:800}button:disabled{opacity:.4}.note{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-size:11px;color:var(--muted)}
.flow .step-current{position:relative;color:var(--text);font-weight:700;padding:0 2px}
.flow .step-current::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:999px;background:#b69570}
.flow .step-current .step-num{display:inline;width:auto;height:auto;background:none;color:inherit;font-size:inherit;line-height:inherit}
.flow .step-future{color:var(--muted)}
.flow .arrow{color:#b9afa4}
</style></head><body><main class="wrap">
<div class="flow"><span class="step-current"><span class="step-num">1</span>入力</span><span class="arrow">→</span><span class="step-future">2 プレビュー</span><span class="arrow">→</span><span class="step-future">3 購入確認</span><span class="arrow">→</span><span class="step-future">4 完成</span></div>
<div class="brand">コエフォト</div>
<section class="hero"><small>PHOTO × VOICE</small><h1>写真に、<em>声をのせて</em><br>贈ろう。</h1></section>
<form id="form">
<div class="step"><div class="n">1</div><div class="content"><b>贈る相手のお名前</b><div class="field-help">「贈るカード」と「QRから見るページ」に表示されます</div><input id="recipient" maxlength="15" required placeholder="例：おばあちゃん"><div class="count"><span id="rc">0</span> / 15文字</div></div></div>
<div class="step"><div class="n">2</div><div class="content"><b>カードに載せるメッセージ</b><div class="field-help">この文章は「贈るカード」に表示されます</div><textarea id="message" maxlength="100" required placeholder="例：いつもありがとう。これからも元気でいてね！"></textarea><div class="count"><span id="mc">0</span> / 100文字</div></div></div>
<div class="step"><div class="n">3</div><div class="content"><b>贈り主のお名前</b><div class="field-help">「贈るカード」と「QRから見るページ」に表示されます</div><input id="sender" maxlength="15" required placeholder="例：さくら"><div class="count"><span id="sc">0</span> / 15文字</div></div></div>
<div class="step"><div class="n">4</div><div class="content"><b>写真を選ぶ</b><label class="upload"><span class="upload-plus">＋</span> 写真を選ぶ<input id="photo" type="file" accept="image/*"></label><img id="photoPreview"></div></div>
<div class="step"><div class="n">5</div><div class="content"><b>声を追加する</b><div class="field-help">この声は「QRから見るページ」で再生されます</div><div class="recorder"><div class="voice-options"><button id="recordBtn" class="record-btn" type="button"><span class="icon">🎙️</span><span>この場で録音</span><span class="sub">マイクを使って録音します</span></button><label class="voice-option audio-file-label"><span class="icon">＋</span><span class="title">音声ファイル</span><span class="sub">録音済みの声を選びます</span><input id="audioFile" type="file" accept=".m4a,.mp3,.aac,.wav,.mpeg,audio/mp4,audio/mpeg,audio/aac,audio/wav"></label></div><div id="recordStatus" class="record-status">どちらかを選んでください</div><audio id="audioPreview" controls></audio><div id="recordActions" class="record-actions"><button id="retryRecord" type="button">録り直す</button></div></div></div></div>
<label class="consent"><input id="consent" type="checkbox" required><span>写真・音声を「贈るカード」と「QRから見るページ」の作成・プレビューのために利用することに同意します。また、使用に必要な許可を得ていることを確認済みです。</span></label>
<button id="go" type="submit">プレビューを確認</button>
<div class="note">プレビューまでは無料。完成版は480円（税込）です。</div>
</form></main>
<script>
const $=id=>document.getElementById(id);
[['recipient','rc'],['message','mc'],['sender','sc']].forEach(([a,b])=>$(a).addEventListener('input',()=>$(b).textContent=$(a).value.length));
let storedPhoto=null;
let storedAudio=null;
let photoObjectUrl=null;
let audioObjectUrl=null;

function showPhoto(blob){
  if(!blob)return;
  if(photoObjectUrl)URL.revokeObjectURL(photoObjectUrl);
  photoObjectUrl=URL.createObjectURL(blob);
  $('photoPreview').src=photoObjectUrl;
  $('photoPreview').style.display='block';
}
function showAudio(blob){
  if(!blob)return;
  if(audioObjectUrl)URL.revokeObjectURL(audioObjectUrl);
  audioObjectUrl=URL.createObjectURL(blob);
  $('audioPreview').src=audioObjectUrl;
  $('audioPreview').style.display='block';
}

$('photo').addEventListener('change',()=>{
  const f=$('photo').files[0];
  if(f){storedPhoto=f;showPhoto(f)}
});
let recordedAudio=null;
let mediaRecorder=null;
let mediaStream=null;
let chunks=[];
let recordStartedAt=0;
let timerId=null;
const recordBtn=$('recordBtn'), recordStatus=$('recordStatus'), recordActions=$('recordActions');

function stopMic(){
  if(mediaStream){mediaStream.getTracks().forEach(track=>track.stop());mediaStream=null}
}
function resetRecording(){
  if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
  stopMic(); clearInterval(timerId); recordedAudio=null; storedAudio=null; chunks=[];
  $('audioPreview').pause(); $('audioPreview').removeAttribute('src'); $('audioPreview').load(); $('audioPreview').style.display='none';
  recordActions.style.display='none'; recordBtn.style.display='flex'; recordBtn.classList.remove('recording');
  recordBtn.innerHTML='<span class="icon">🎙️</span><span>この場で録音</span><span class="sub">マイクを使って録音します</span>';
  recordStatus.textContent='どちらかを選んでください';
}
async function startRecording(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){alert('このブラウザでは録音機能を利用できません。Safariを最新版にしてお試しください。');return}
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const preferred=['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    const mime=preferred.find(x=>MediaRecorder.isTypeSupported?.(x));
    mediaRecorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream);
    chunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      clearInterval(timerId); stopMic();
      const type=mediaRecorder.mimeType || chunks[0]?.type || 'audio/mp4';
      const ext=type.includes('webm')?'webm':'m4a';
      recordedAudio=new File([new Blob(chunks,{type})],`koephoto-recording.${ext}`,{type});
      storedAudio=recordedAudio;
      showAudio(recordedAudio);
      recordBtn.style.display='none'; recordActions.style.display='flex'; recordStatus.textContent='録音できました。再生して内容を確認できます';
    };
    mediaRecorder.start(); recordStartedAt=Date.now();
    recordBtn.classList.add('recording');
    recordBtn.innerHTML='<span class="icon">■</span><span>録音を停止</span><span class="sub">タップして録音を終了します</span>';
    const tick=()=>{const s=Math.floor((Date.now()-recordStartedAt)/1000);recordStatus.textContent=`録音中 ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}; tick(); timerId=setInterval(tick,500);
  }catch(err){stopMic(); recordStatus.textContent='マイクを使用できませんでした'; alert('録音にはマイクの使用許可が必要です。Safariのマイク許可を確認してください。')}
}
recordBtn.addEventListener('click',()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop();else startRecording()});
$('retryRecord').addEventListener('click',resetRecording);
$('audioFile').addEventListener('change',()=>{
  const f=$('audioFile').files[0];
  if(!f)return;
  const name=(f.name||'').toLowerCase(), type=(f.type||'').toLowerCase();
  const ok=/\.(m4a|mp3|aac|wav|mpeg)$/i.test(name) || type.startsWith('audio/') || type==='application/octet-stream' || type==='';
  if(!ok){
    alert('m4a / mp3 / aac / wav 形式の音声ファイルを選んでください。');
    $('audioFile').value='';
    return;
  }
  if(mediaRecorder?.state==='recording') mediaRecorder.stop();
  stopMic(); clearInterval(timerId);
  recordedAudio=f;
  storedAudio=f;
  showAudio(f);
  recordBtn.style.display='flex';
  recordBtn.classList.remove('recording');
  recordBtn.innerHTML='<span class="icon">🎙️</span><span>この場で録音</span><span class="sub">マイクを使って録音します</span>';
  recordActions.style.display='none';
  recordStatus.textContent='音声ファイルを選択しました。再生して内容を確認できます';
});
function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('draft'))r.result.createObjectStore('draft')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function put(k,v){const x=await db();await new Promise((ok,ng)=>{const t=x.transaction('draft','readwrite');t.objectStore('draft').put(v,k);t.oncomplete=ok;t.onerror=()=>ng(t.error)});x.close()}
async function get(k){const x=await db();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}

// プレビュー/購入確認から入力画面へ戻ったとき、前回の入力内容を復元する。
(async()=>{
  try{
    let saved=null;
    try{ saved=JSON.parse(sessionStorage.getItem('koephoto-draft')||'null'); }catch(e){}
    if(!saved) saved=await get('form');

    if(saved){
      $('recipient').value=saved.recipient||'';
      $('message').value=saved.message||'';
      $('sender').value=saved.sender||'';
      $('rc').textContent=$('recipient').value.length;
      $('mc').textContent=$('message').value.length;
      $('sc').textContent=$('sender').value.length;
      sessionStorage.setItem('koephoto-draft',JSON.stringify(saved));
    }

    const [p,a]=await Promise.all([get('photo'),get('audio')]);
    if(p){ storedPhoto=p; showPhoto(p); }
    if(a){
      storedAudio=a;
      recordedAudio=a;
      showAudio(a);
      recordStatus.textContent='前回選択した音声を引き続き使用できます';
    }
  }catch(err){
    console.warn('入力内容の復元に失敗しました',err);
  }
})();

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!e.currentTarget.reportValidity())return;

  const p=$('photo').files[0] || storedPhoto;
  const a=recordedAudio || storedAudio;
  if(!p){alert('写真を選んでください。');return}
  if(!a){alert('声を録音するか、音声ファイルを選んでください。');return;}
const draftData={recipient:$('recipient').value.trim(),message:$('message').value.trim(),sender:$('sender').value.trim()};
sessionStorage.setItem('koephoto-draft',JSON.stringify(draftData));
// Safariの画面遷移でも作成内容を保持するため、文字データもIndexedDBへ保存。
await Promise.all([put('form',draftData),put('photo',p),put('audio',a)]);
location.href='preview.html';
});
</script></body></html>
