<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3">
  <title>ばあばへ｜お誕生日おめでとう！</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg,#fff8f3 0%,#fffdf9 100%);
      font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      color: #5e463e;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 42px; }
    .card {
      background:#fffefb;
      border:1px solid #f3d9d5;
      border-radius:28px;
      padding:20px;
      box-shadow:0 12px 34px rgba(91,61,52,.10);
    }
    .to {
      text-align:center; font-size:24px; font-weight:700;
      background:#f8d7dc; border-radius:18px; padding:10px 14px; margin-bottom:16px;
    }
    h1 { text-align:center; font-size:31px; margin:18px 0 10px; line-height:1.3; }
    .photo {
      width:100%; display:block; border-radius:20px; border:6px solid #fff;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }
    .msg { text-align:center; font-size:18px; line-height:1.8; margin:14px 0 6px; }
    .voicebox {
      margin-top:22px; padding:16px; border-radius:20px; background:#fff3f4;
      border:1px solid #f0c8ce;
    }
    .voice-title { text-align:center; font-weight:700; margin-bottom:10px; }
    audio { width:100%; display:block; }
    .sender { text-align:center; margin-top:22px; font-weight:700; color:#cf7280; letter-spacing:.05em; }
    .note { text-align:center; font-size:12px; color:#927b73; margin-top:10px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="to">ばあばへ</div>
      <img class="photo" src="https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/card-public?id=99e887e0-1814-4d4a-b463-fbbfa1d4424b&media=photo" alt="RITSUとSAKURAの写真">
      <h1>お誕生日おめでとう！</h1>
      <div class="msg">
        いつもありがとう。<br>
        これからも元気でいてね！
      </div>

      <div class="voicebox">
        <div class="voice-title">♪ 声を聞いてね</div>
        <audio controls playsinline preload="metadata">
          <source src="https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/card-public?id=99e887e0-1814-4d4a-b463-fbbfa1d4424b&media=audio" type="audio/mp4">
          音声を再生できません。
        </audio>
        <div class="note">再生ボタンを押すと音声が流れます</div>
      </div>

      <div class="sender">RITSU &amp; SAKURA より</div>
    </section>
  </main>
</body>
</html>
