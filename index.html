<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RITSU &amp; SAKURAから、ばあばへの音声付きバースデーカード">
<title>ばあばへ｜Happy Birthday Voice Card</title>

<style>
:root{
  --n:#10294f;
  --b:#244f82;
  --g:#c5a052;
  --i:#fbf8ef;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 50% -10%,#294f7d,#142f54 38%,#091a33 80%);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

.page{
  min-height:100svh;
  padding:20px 10px 30px;
  display:flex;
  justify-content:center;
}

.wrap{
  width:min(600px,100%);
}

.brand{
  text-align:center;
  color:#e2c985;
  font:10px Georgia,serif;
  letter-spacing:.3em;
  margin-bottom:15px;
}

.card{
  position:relative;
  overflow:hidden;
  background:var(--i);
  border:1px solid #d6b567;
  border-radius:6px;
  box-shadow:0 28px 65px #0006;
  padding:20px 16px 0;
}

.card:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid #c5a05244;
  pointer-events:none;
}

.top{
  text-align:center;
  padding:10px 5px 20px;
}

.heart{
  color:var(--g);
  font-size:35px;
}

#hb-title{
  font-family:"Snell Roundhand","Apple Chancery",cursive;
  font-weight:400;
  font-style:normal;
  font-size:1.32em;
  letter-spacing:0;
  color:#c79a45;
  display:inline-block;
}

.occasion{
  color:var(--n);
  font:13px Georgia,serif;
  letter-spacing:.23em;
  margin-top:8px;
  opacity:.82;
}

.rule{
  width:120px;
  height:1px;
  margin:14px auto;
  background:linear-gradient(90deg,transparent,var(--g),transparent);
}

.photo{
  position:relative;
  aspect-ratio:4/3;
  border:1px solid #c5a052;
  padding:6px;
  background:#f2ede3;
  margin-bottom:32px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border:1px solid #10294f22;
  background:#f4efe4;
}

.voice{
  margin:0 7px;
  padding:17px 15px;
  border:1px solid #244f824d;
  border-radius:16px;
  background:linear-gradient(#ffffffbb,#e7eef68c);
}

.vh{
  text-align:center;
  color:var(--n);
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  letter-spacing:.01em;
  margin-bottom:14px;
  font-size:20px;
  font-weight:700;
}

.player{
  display:flex;
  align-items:center;
  gap:13px;
}

.play{
  width:54px;
  height:54px;
  flex:none;
  border-radius:50%;
  border:1px solid var(--b);
  background:radial-gradient(circle at 35% 28%,#365f91,#173d6b 52%,#0d284d);
  color:#fff;
  font-size:21px;
}

.track{
  height:3px;
  flex:1;
  background:#d4d9df;
  border-radius:10px;
}

.audio{
  text-align:center;
  color:#8a806f;
  font-size:10px;
  letter-spacing:.12em;
  margin-top:10px;
}

.sender{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c79a45;
  font-family:"Caveat","Snell Roundhand",cursive;
  font-size:21px;
  font-weight:700;
  letter-spacing:.04em;
  margin-top:14px;
}

.bottom{
  height:18px;
  margin:0 -16px;
  background:linear-gradient(90deg,var(--n),var(--b),var(--n));
  border-top:2px solid var(--g);
}

@media(max-width:430px){
  .card{
    padding:14px 11px 0;
  }

  .card:before{
    inset:6px;
  }

  .voice{
    margin:0 5px;
  }

  .bottom{
    margin:0 -11px;
  }
}
</style>
</head>

<body>

<main class="page">
<div class="wrap">

<div class="brand">VOICE CARD</div>

<article class="card">

<header class="top">
  <div class="heart">
    <span id="hb-title">Happy Birthday</span>
  </div>

  <div class="occasion">
    A SPECIAL MESSAGE FOR YOU
  </div>

  <div class="rule"></div>
</header>

<section class="photo">
  <img
    src="https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/card-public?id=99e887e0-1814-4d4a-b463-fbbfa1d4424b&amp;media=photo"
    alt="">
</section>

<section class="voice">

  <div class="vh">♬&nbsp; 声を聞いてね</div>

  <div class="player">

    <button
      class="play"
      id="playBtn"
      aria-label="音声を再生">
      ▶
    </button>

    <div class="track">
      <div
        id="progress"
        style="height:100%;width:0;background:#244f82;border-radius:10px">
      </div>
    </div>

    <audio
      id="voiceAudio"
      preload="metadata"
      src="https://qbutohdqtgzjejnwdqcx.supabase.co/functions/v1/card-public?id=99e887e0-1814-4d4a-b463-fbbfa1d4424b&amp;media=audio">
    </audio>

  </div>

  <div class="audio">
    再生ボタンを押すと音声のメッセージが流れます
  </div>

</section>

<div class="sender">
  RITSU &amp; SAKURA
</div>

<div class="bottom"></div>

</article>
</div>
</main>

<script>
const audio = document.getElementById("voiceAudio");
const btn = document.getElementById("playBtn");
const progress = document.getElementById("progress");

btn.addEventListener("click", async () => {
  if(audio.paused){
    try{
      await audio.play();
      btn.textContent = "Ⅱ";
    }catch(e){
      console.error(e);
    }
  }else{
    audio.pause();
    btn.textContent = "▶";
  }
});

audio.addEventListener("timeupdate", () => {
  if(audio.duration){
    progress.style.width =
      ((audio.currentTime / audio.duration) * 100) + "%";
  }
});

audio.addEventListener("ended", () => {
  btn.textContent = "▶";
  progress.style.width = "0%";
});
</script>

</body>
</html>
