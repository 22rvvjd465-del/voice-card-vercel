<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト | Classic Birthday</title>
<style>
:root{--card-w:min(94vw,540px);--navy:#0b347f;--paper:#fbf7ee;--ink:#2d2a25}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f1ea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 42px}
.card{position:relative;width:var(--card-w);aspect-ratio:1060/1484;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px rgba(30,35,45,.09)}
.photo{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:transparent}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;pointer-events:none}
.recipient,.sender{position:absolute;z-index:4;color:var(--navy);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 固定アート内の実際の罫線座標に合わせて配置。
   To line:   x=338..760, y=272 / 1060x1484
   From line: x=421..747, y=1237 / 1060x1484
   名前は罫線の5px上に置き、罫線中央に正確に揃える。 */
.recipient{
  left:31.887%;width:39.811%;top:18.329%;
  transform:translateY(calc(-100% + 0.6px));
  text-align:center;font-size:clamp(15px,3.5vw,22px)
}
.sender{
  left:39.717%;width:30.755%;top:83.356%;
  transform:translateY(calc(-100% + 0.6px));
  text-align:center;font-size:clamp(14px,3.2vw,21px)
}
.player{
  position:absolute;z-index:4;
  left:11.13%;top:70.35%;width:77.83%;height:7.41%;
  display:grid;grid-template-columns:34px 1fr;
  align-items:center;column-gap:14px;
  padding:8px 26px 10px 28px;
  transform:translateY(-3px);
}
.play{
  width:34px;height:34px;border:0;border-radius:50%;
  background:var(--navy);color:#fff;
  display:grid;place-items:center;
  font-size:15px;line-height:1;cursor:pointer;
  flex:0 0 auto;padding:0;
  -webkit-tap-highlight-color:transparent;
  transform:translateY(-2px);
}
.track{min-width:0;align-self:center}
.seek{
  --progress:0%;
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;height:16px;margin:0;
  background:transparent;cursor:pointer;
}
.seek::-webkit-slider-runnable-track{
  height:3px;border-radius:999px;
  background:linear-gradient(to right,var(--navy) 0 var(--progress),#d6c7ae var(--progress) 100%);
}
.seek::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;border-radius:50%;
  margin-top:-4.5px;
  background:#fff;border:2px solid var(--navy);
  box-shadow:0 1px 3px rgba(0,0,0,.16);
}
.seek::-moz-range-track{height:3px;border-radius:999px;background:#d6c7ae}
.seek::-moz-range-progress{height:3px;border-radius:999px;background:var(--navy)}
.seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.time{
  margin-top:-1px;
  font-size:11px;line-height:1;
  color:#756a5b;
  display:flex;justify-content:space-between;
  font-variant-numeric:tabular-nums;
}
.brand{width:var(--card-w);text-align:center;padding-top:18px;line-height:1.25}
.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:18px;letter-spacing:.08em}
.tagline{margin-top:5px;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.18em;color:#746c62}
body.embedded .page{min-height:0;padding-bottom:18px}
@media(max-width:390px){.page{padding-left:8px;padding-right:8px}.player{grid-template-columns:30px 1fr;column-gap:10px;padding:8px 20px 10px 22px;transform:translateY(-3px)}.play{width:30px;height:30px;font-size:13px}.time{font-size:10px}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="page">
<section class="card" aria-label="Classic Birthday ボイスカード">
  <canvas id="photoCanvas" class="photo" width="1060" height="1484" aria-label="贈られた写真"></canvas>
  <img class="art" src="./koefoto_classic_birthday_overlay.png" alt="">
  <div id="recipient" class="recipient"></div>
  <div class="player">
    <button class="play" id="playBtn" aria-label="再生">▶</button>
    <div class="track">
      <input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>
  <div id="sender" class="sender"></div>
  <audio id="audio" preload="metadata"></audio>
</section>
<footer class="brand">
  <div class="brand-name">コエフォト</div>
  <div class="tagline">A PHOTO, A VOICE, A MEMORY.</div>
</footer>
</main>
<script>
const $=id=>document.getElementById(id);

// プレビュー内（iframe）では、実コンテンツ高さを親ページへ通知して余白をなくす。
if(window.self !== window.top){
  document.body.classList.add('embedded');
  const reportHeight=()=>{
    const page=document.querySelector('.page');
    if(!page)return;
    const h=Math.ceil(page.getBoundingClientRect().height);
    parent.postMessage({type:'koefoto-voice-height',height:h},location.origin);
  };
  window.addEventListener('load',()=>requestAnimationFrame(reportHeight));
  if('ResizeObserver' in window){
    new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.querySelector('.page'));
  }
}

function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){const x=await db();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}
const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,'0')}`};

(async()=>{
  let raw='{}';
  try{ raw=(parent && parent.sessionStorage ? parent.sessionStorage.getItem('koephoto-draft') : null) || sessionStorage.getItem('koephoto-draft') || '{}'; }catch(e){ raw=sessionStorage.getItem('koephoto-draft')||'{}'; }
  const d=JSON.parse(raw);
  $('recipient').textContent=d.recipient||'';
  $('sender').textContent=d.sender||'';
  try{
    const [photo,audioBlob]=await Promise.all([get('photo'),get('audio')]);
    if(photo){
      const pu=URL.createObjectURL(photo);
      const img=new Image();
      img.src=pu;
      await img.decode();

      const c=$('photoCanvas'),ctx=c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);

      // 前スレッドで確定した Classic Birthday 写真枠の4点。
      // 固定デザインの写真枠4点
      const frame=[
        {x:36.3,y:322.25},
        {x:1017.58,y:300.26},
        {x:1029.80,y:863.73},
        {x:48.02,y:883.88}
      ];

      // 写真だけを枠の内側へ少し縮める。
      // デザイン画像・花束・ハート・プレーヤーは一切変更しない。
      const cx=frame.reduce((s,p)=>s+p.x,0)/4;
      const cy=frame.reduce((s,p)=>s+p.y,0)/4;
      const scale=0.972;
      const pts=frame.map(p=>({
        x:cx+(p.x-cx)*scale,
        y:cy+(p.y-cy)*scale
      }));

      const minX=Math.min(...pts.map(p=>p.x)), maxX=Math.max(...pts.map(p=>p.x));
      const minY=Math.min(...pts.map(p=>p.y)), maxY=Math.max(...pts.map(p=>p.y));
      const fw=maxX-minX, fh=maxY-minY;
      const ir=img.width/img.height, fr=fw/fh;
      let sx=0,sy=0,sw=img.width,sh=img.height;
      if(ir>fr){sw=img.height*fr;sx=(img.width-sw)/2}else{sh=img.width/fr;sy=(img.height-sh)/2}

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0].x,pts[0].y);
      ctx.lineTo(pts[1].x,pts[1].y);
      ctx.lineTo(pts[2].x,pts[2].y);
      ctx.lineTo(pts[3].x,pts[3].y);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);
      ctx.restore();

      URL.revokeObjectURL(pu);
    }
    if(audioBlob)$('audio').src=URL.createObjectURL(audioBlob);
  }catch(e){console.error(e)}
})();

const audio=$('audio'),btn=$('playBtn'),seek=$('seek'),cur=$('cur'),dur=$('dur');
btn.addEventListener('click',async()=>{if(!audio.src)return;if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause()});
audio.addEventListener('play',()=>btn.textContent='❚❚');
audio.addEventListener('pause',()=>btn.textContent='▶');
function syncSeek(){
  const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;
  seek.value=pct;
  seek.style.setProperty('--progress',pct+'%');
}
audio.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(audio.duration);syncSeek()});
audio.addEventListener('durationchange',()=>{dur.textContent=fmt(audio.duration);syncSeek()});
audio.addEventListener('timeupdate',()=>{cur.textContent=fmt(audio.currentTime);syncSeek()});
audio.addEventListener('ended',()=>{btn.textContent='▶';audio.currentTime=0;cur.textContent='0:00';syncSeek()});
seek.addEventListener('input',()=>{if(audio.duration){audio.currentTime=(Number(seek.value)/100)*audio.duration;syncSeek()}});
</script>


<script>
(function(){
  const LIMITS = {
    recipient: { maxChars: 20, maxPx: 22, minPx: 9 },
    sender:    { maxChars: 15, maxPx: 21, minPx: 9 }
  };

  function fitName(el){
    if(!el) return;

    const isRecipient = el.classList.contains('recipient');
    const spec = isRecipient ? LIMITS.recipient : LIMITS.sender;
    const chars = [...(el.textContent || '').trim()];

    if(chars.length > spec.maxChars){
      el.textContent = chars.slice(0, spec.maxChars).join('');
    }

    const style = getComputedStyle(el);
    const available =
      el.clientWidth
      - (parseFloat(style.paddingLeft) || 0)
      - (parseFloat(style.paddingRight) || 0);

    if(available <= 0) return;

    const canvas = fitName.canvas || (fitName.canvas = document.createElement('canvas'));
    const ctx = canvas.getContext('2d');

    let low = spec.minPx;
    let high = spec.maxPx;
    let best = low;

    for(let i=0; i<20; i++){
      const size = (low + high) / 2;

      ctx.font =
        `${style.fontStyle} ${style.fontVariant} ${style.fontWeight} ${size}px ${style.fontFamily}`;

      const textWidth = ctx.measureText(el.textContent).width;
      const ls = parseFloat(style.letterSpacing);
      const letterSpacingWidth =
        Number.isFinite(ls) ? Math.max(0, [...el.textContent].length - 1) * ls : 0;

      const totalWidth = textWidth + letterSpacingWidth;

      if(totalWidth <= available - 1){
        best = size;
        low = size;
      }else{
        high = size;
      }
    }

    el.style.fontSize = best.toFixed(2) + 'px';
    el.style.whiteSpace = 'nowrap';
    el.style.overflow = 'visible';
    el.style.textOverflow = 'clip';
  }

  function fitAllNames(){
    document.querySelectorAll('.recipient,.sender').forEach(fitName);
  }

  function runFit(){
    requestAnimationFrame(() => requestAnimationFrame(fitAllNames));
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(runFit);
  }else{
    window.addEventListener('load', runFit, {once:true});
  }

  window.addEventListener('resize', runFit);

  document.querySelectorAll('.recipient,.sender').forEach(el=>{
    new MutationObserver(runFit).observe(el,{
      childList:true,
      characterData:true,
      subtree:true
    });
  });
})();
</script>

</body>
</html>
