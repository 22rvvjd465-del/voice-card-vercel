.photo{
  position:absolute;inset:0;width:100%;height:100%;z-index:2;
  background:transparent;pointer-events:none
}
.recipient,.sender{
  position:absolute;z-index:5;color:#0b347f;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:500;letter-spacing:.02em;white-space:nowrap;
  overflow:hidden;text-overflow:clip;text-align:center
}
.recipient{
  left:27.0%;width:53.5%;top:30.10%;
  transform:translateY(-100%);
}
.sender{
  left:38.5%;width:28.7%;top:90.10%;
  transform:translateY(-100%);
}

/* ===== Voice Focus player ===== */
.player{
  position:absolute;z-index:12;
  left:8.3%;right:8.3%;top:56.5%;height:15.1%;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2.2%;
}
.wave{
  position:relative;z-index:10;height:55%;
  display:flex;align-items:center;gap:2.4%;
}
.wave.left{justify-content:flex-end}
.wave.right{justify-content:flex-start}
.bar{
  width:2.4%;min-width:2px;border-radius:99px;
  background:linear-gradient(180deg,#fff2c7 0%,var(--gold1) 18%,#e4bd65 52%,var(--gold2) 72%,var(--gold3) 100%);
  box-shadow:0 0 4px rgba(255,226,151,.38),0 0 10px rgba(223,178,82,.22),0 1px 2px rgba(110,73,15,.14);
  transform-origin:center;
  transition:filter .18s ease,box-shadow .18s ease
}
.sparkles{
  position:absolute;inset:-18% -4%;pointer-events:none;z-index:8;overflow:visible
}
.sparkle{
  position:absolute;width:6px;height:6px;opacity:0;border-radius:50%;
  transform:translate(-50%,-50%) scale(.35);
  background:radial-gradient(circle,
    rgba(255,255,240,1) 0%,
    rgba(255,244,205,.98) 22%,
    rgba(238,205,133,.92) 46%,
    rgba(211,164,73,.52) 68%,
    rgba(211,164,73,0) 100%);
  box-shadow:0 0 5px rgba(255,244,210,.95),0 0 11px rgba(235,198,118,.72),0 0 18px rgba(199,147,46,.24)
}
.sparkle.small{width:3px;height:3px}
.sparkle.large{width:8px;height:8px}
.start-burst .sparkle{
  animation:sparkleBurst var(--dur,1.9s) cubic-bezier(.2,.65,.25,1) var(--delay,0s) 1 both
}
@keyframes sparkleBurst{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.25)}
  16%{opacity:.95}
  58%{opacity:.78;transform:translate(-50%,-50%) translate(var(--dx,0px),var(--dy,0px)) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(calc(var(--dx,0px)*1.35),calc(var(--dy,0px)*1.35)) scale(.52)}
}
.ending .sparkle:nth-child(2n){animation:sparkleEnd 1.5s ease-out calc(var(--delay,0s)*.18) 1 both}
.ending .sparkle:nth-child(2n+1){animation:sparkleEnd 1.85s ease-out calc(var(--delay,0s)*.12) 1 both}
@keyframes sparkleEnd{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.25)}
  28%{opacity:.72}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--edx,0px),var(--edy,-12px)) scale(.45)}
}
.ending .disc{animation:endDisc 1.8s ease-out 1}
.ending .play{animation:endButton 1.65s ease-out 1}
.ending .bar{animation:waveFarewell 1.55s ease-out 1}
@keyframes endDisc{
  0%{filter:brightness(1)}
  30%{filter:brightness(1.20);box-shadow:0 0 28px rgba(229,190,103,.38),0 8px 17px rgba(5,33,65,.19)}
  100%{filter:brightness(1)}
}
@keyframes endButton{
  0%{transform:translate(-50%,-50%) scale(1)}
  28%{transform:translate(-50%,-50%) scale(1.08)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
@keyframes waveFarewell{
  0%{filter:brightness(1.3);opacity:1}
  35%{filter:brightness(1.65);opacity:1}
  100%{filter:brightness(1);opacity:.96}
}
.playing .bar{
  filter:brightness(1.28) saturate(1.12);
  box-shadow:0 0 5px rgba(255,239,190,.82),0 0 12px rgba(233,190,96,.72),0 0 22px rgba(205,151,47,.30)
}
.core{
  position:relative;z-index:11;width:clamp(108px,27.5cqw,146px);
  aspect-ratio:1;border-radius:50%;display:grid;place-items:center
}
.ripple{
  position:absolute;inset:0;border-radius:50%;border:1px solid rgba(205,163,77,.34);
  opacity:0;pointer-events:none
}
.start-burst .r1{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) 0s 1}
.start-burst .r2{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) .18s 1}
.start-burst .r3{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) .36s 1}
@keyframes rippleStart{
  0%{transform:scale(.86);opacity:0}
  12%{opacity:.82}
  60%{opacity:.28}
  100%{transform:scale(1.55);opacity:0}
}
.disc{
  position:absolute;inset:7%;border-radius:50%;
  background:
    radial-gradient(circle at 36% 25%,rgba(255,255,255,.12),transparent 25%),
    radial-gradient(circle at 50% 40%,#124d89 0%,var(--navy) 45%,var(--navy2) 100%);
  border:1.5px solid #d4ad5c;
  box-shadow:0 8px 17px rgba(5,33,65,.19),inset 0 0 0 6px rgba(255,255,255,.015)
}
.disc:before{
  content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid rgba(238,207,137,.60)
}
.disc:after{
  content:"";position:absolute;inset:-7%;border-radius:50%;border:1px solid rgba(205,163,77,.17)
}
.play{
  position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);
  width:50%;aspect-ratio:1;border:0;border-radius:50%;padding:0;
  display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 34% 25%,#f7e5b0 0%,#e0bd6d 24%,#c99940 60%,#a67220 100%);
  box-shadow:0 6px 13px rgba(77,51,7,.22),inset 0 1px 0 rgba(255,255,255,.58),inset 0 -6px 12px rgba(88,53,5,.10);
  -webkit-tap-highlight-color:transparent
}
.play:active{transform:translate(-50%,-50%) scale(.94)}
.play svg{
  width:76%;height:76%;fill:#fffdf7;transform:translateX(4%);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))
}
.playing .play{
  background:radial-gradient(circle at 34% 25%,#fff3ca 0%,#efd79c 20%,#dfbd6d 48%,#c99238 78%,#9f6e1f 100%);
  box-shadow:0 6px 13px rgba(77,51,7,.20),0 0 10px rgba(255,244,210,.90),0 0 22px rgba(236,199,115,.80),0 0 38px rgba(205,154,57,.42),inset 0 1px 0 rgba(255,255,255,.76),inset 0 -6px 12px rgba(88,53,5,.08)
}
.playing .disc{
  box-shadow:0 8px 17px rgba(5,33,65,.19),0 0 16px rgba(220,179,88,.14),inset 0 0 0 6px rgba(255,255,255,.015)
}

.brand{
  width:var(--card-w);
  text-align:center;
  padding-top:16px;
  line-height:1;
  background:transparent;
}
.brand img{
  display:block;
  width:min(46%,210px);
  height:auto;
  margin:0 auto;
}
body.embedded .page{min-height:0;padding-bottom:18px}
@media(max-width:390px){
  .page{padding-left:8px;padding-right:8px}
  .player{left:8%;right:8%;top:56.4%;gap:1.8%}
  .wave{gap:2.1%}
}
@media(prefers-reduced-motion:reduce){
  .start-burst .sparkle,.start-burst .ripple,.ending .sparkle,.ending .bar,.ending .disc,.ending .play{animation:none!important}
}
</style>
</head>
<body>
<main class="page">
<section class="card" aria-label="Classic Birthday ボイスカード">
  <canvas id="photoCanvas" class="photo" width="1024" height="1536" aria-label="贈られた写真"></canvas>
  <div id="recipient" class="recipient"></div>

  <div class="player" id="player">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <div class="wave left" id="waveL"></div>
    <div class="core">
      <span class="ripple r1"></span><span class="ripple r2"></span><span class="ripple r3"></span>
      <div class="disc"></div>
      <button class="play" id="playBtn" type="button" aria-label="音声を再生">
        <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L18.4 12z"/></svg>
      </button>
    </div>
    <div class="wave right" id="waveR"></div>
  </div>

  <div id="sender" class="sender"></div>
  <audio id="audio" preload="metadata"></audio>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));

if(window.self!==window.top){
  document.body.classList.add('embedded');
  const reportHeight=()=>{
    const page=document.querySelector('.page');
    if(page)parent.postMessage({type:'koefoto-voice-height',height:Math.ceil(page.getBoundingClientRect().height)},location.origin);
  };
  window.addEventListener('load',()=>requestAnimationFrame(reportHeight));
  if('ResizeObserver' in window)new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.querySelector('.page'));
}

function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){
  const x=await db();
  const v=await new Promise((ok,ng)=>{
    const t=x.transaction('draft');
    const r=t.objectStore('draft').get(k);
    r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)
  });
  x.close();return v
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error||new Error('file_read_failed'));
    r.readAsDataURL(blob)
  })
}
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('image_load_failed'));
    img.src=src
  })
}
async function normalizeAudioBlob(blob){
  const buf=await blob.arrayBuffer();
  let type=blob.type||'';
  if(!type||type==='application/octet-stream')type='audio/mp4';
  return new Blob([buf],{type});
}

let photoFocusX=.5,photoFocusY=.5,photoZoom=1,redrawPhoto=null;

(async()=>{
  let raw='{}';
  try{
    raw=(parent&&parent.sessionStorage?parent.sessionStorage.getItem('koephoto-draft'):null)
      ||sessionStorage.getItem('koephoto-draft')||'{}'
  }catch(e){
    raw=sessionStorage.getItem('koephoto-draft')||'{}'
  }
  const d=JSON.parse(raw);
  photoFocusX=Number.isFinite(Number(d.photoFocusX))?clamp(Number(d.photoFocusX),0,1):.5;
  photoFocusY=Number.isFinite(Number(d.photoFocusY))?clamp(Number(d.photoFocusY),0,1):.5;
  photoZoom=Number.isFinite(Number(d.photoZoom))?clamp(Number(d.photoZoom),1,2.5):1;
  $('recipient').textContent=[...(d.recipient||'')].slice(0,15).join('');
  $('sender').textContent=[...(d.sender||'')].slice(0,15).join('');

  try{
    const [photo,audioBlob]=await Promise.all([get('photo'),get('audio')]);

    if(photo instanceof Blob&&photo.size){
      const img=await loadImage(await blobToDataURL(photo));
      const c=$('photoCanvas'),ctx=c.getContext('2d');

      // 新Classic Birthdayボイスページの写真枠内側。背景の金枠を隠さない。
      const frame=[
        {x:121,y:502},
        {x:903,y:502},
        {x:903,y:942},
        {x:121,y:942}
      ];
      const minX=121,maxX=903,minY=502,maxY=942;
      const fw=maxX-minX,fh=maxY-minY;
      const ir=img.width/img.height,fr=fw/fh;
      let baseSw=img.width,baseSh=img.height;
      if(ir>fr)baseSw=img.height*fr;else baseSh=img.width/fr;

      redrawPhoto=()=>{
        ctx.clearRect(0,0,c.width,c.height);
        const sw=baseSw/photoZoom,sh=baseSh/photoZoom;
        const sx=(img.width-sw)>0.5?(img.width-sw)*photoFocusX:0;
        const sy=(img.height-sh)>0.5?(img.height-sh)*photoFocusY:0;
        ctx.save();
        ctx.beginPath();
        ctx.rect(minX,minY,fw,fh);
        ctx.clip();
        ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);
        ctx.restore()
      };
      redrawPhoto()
    }

    if(audioBlob instanceof Blob&&audioBlob.size){
      const safeBlob=await normalizeAudioBlob(audioBlob);
      $('audio').src=URL.createObjectURL(safeBlob);
      $('audio').load()
    }
  }catch(e){console.error(e)}
})();

window.addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.type!=='koefoto-photo-transform'&&e.data.type!=='koefoto-photo-focus')return;
  const x=Number(e.data.x),y=Number(e.data.y),z=Number(e.data.zoom);
  if(Number.isFinite(x))photoFocusX=clamp(x,0,1);
  if(Number.isFinite(y))photoFocusY=clamp(y,0,1);
  if(Number.isFinite(z))photoZoom=clamp(z,1,2.5);
  if(redrawPhoto)redrawPhoto()
});

/* wave + champagne particles */
const heights=[10,14,20,30,45,66,83,62,45,31,22,16,20,29,42,59,76,58,41,28,19,13];
function makeWave(el,rev=false){
  const a=rev?[...heights].reverse():heights;
  a.forEach((h,i)=>{
    const b=document.createElement('span');
    b.className='bar';b.style.height=h+'%';b.dataset.base=h;b.dataset.i=i;
    el.appendChild(b)
  })
}
makeWave($('waveL'));makeWave($('waveR'),true);

const audio=$('audio'),player=$('player'),btn=$('playBtn'),icon=$('icon');
function setIcon(on){
  icon.innerHTML=on
    ?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>'
    :'<path d="M8 5.2v13.6L18.4 12z"/>'
}
let audioCtx=null,analyser=null,mediaSource=null,freqData=null;
let startFxTimer=0,endFxTimer=0;

async function ensureAudioAnalysis(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  try{
    if(!audioCtx){
      audioCtx=new AC();
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=.78;
      freqData=new Uint8Array(analyser.frequencyBinCount);
      mediaSource=audioCtx.createMediaElementSource(audio);
      mediaSource.connect(analyser);
      analyser.connect(audioCtx.destination)
    }
    if(audioCtx.state==='suspended')await audioCtx.resume();
    return true
  }catch(err){
    console.warn('Web Audio analyser unavailable; using fallback animation.',err);
    return false
  }
}
function replayClass(name,duration){
  player.classList.remove(name);void player.offsetWidth;player.classList.add(name);
  const id=setTimeout(()=>player.classList.remove(name),duration);
  if(name==='start-burst'){clearTimeout(startFxTimer);startFxTimer=id}
  if(name==='ending'){clearTimeout(endFxTimer);endFxTimer=id}
}
btn.addEventListener('click',async()=>{
  if(!audio.src)return;
  if(audio.paused){
    try{await ensureAudioAnalysis();await audio.play()}catch(e){console.error(e)}
  }else audio.pause()
});
audio.addEventListener('play',()=>{
  player.classList.remove('ending');
  player.classList.add('playing');
  replayClass('start-burst',2300);
  setIcon(true);btn.setAttribute('aria-label','一時停止')
});
audio.addEventListener('pause',()=>{
  if(!audio.ended)player.classList.remove('playing');
  setIcon(false);btn.setAttribute('aria-label','再生')
});
audio.addEventListener('ended',()=>{
  btn.style.filter='';btn.style.boxShadow='';
  player.classList.remove('playing','start-burst');
  replayClass('ending',2200);
  setIcon(false);btn.setAttribute('aria-label','再生');
  audio.currentTime=0
});

const leftBars=[...document.querySelectorAll('#waveL .bar')];
const rightBars=[...document.querySelectorAll('#waveR .bar')];
function sampledEnergy(i,total){
  if(!analyser||!freqData)return 0;
  const minBin=2,maxBin=Math.min(freqData.length-1,54);
  const pos=i/Math.max(1,total-1);
  const center=Math.round(minBin+(maxBin-minBin)*pos);
  let sum=0,count=0;
  for(let k=-2;k<=2;k++){
    const idx=Math.max(minBin,Math.min(maxBin,center+k));
    sum+=freqData[idx];count++
  }
  return(sum/count)/255
}
function renderBar(b,energy,on){
  const base=+b.dataset.base;
  const response=on?Math.min(1,Math.pow(energy*1.9,.72)):0;
  const h=on?Math.max(13,base*(.62+1.08*response)):base;
  const glow=on?8+26*response:8;
  b.style.height=h+'%';
  b.style.opacity=on?(.78+.22*response):.96;
  b.style.boxShadow=on
    ?`0 0 5px rgba(255,244,205,.95),0 0 ${glow}px rgba(232,187,91,.82),0 0 ${glow+13}px rgba(198,145,42,.32)`
    :'0 0 4px rgba(255,226,151,.38),0 0 10px rgba(223,178,82,.22),0 1px 2px rgba(110,73,15,.14)'
}
function animate(t){
  const on=!audio.paused&&!audio.ended;
  const real=on&&analyser&&freqData&&audioCtx&&audioCtx.state==='running';
  if(real)analyser.getByteFrequencyData(freqData);

  if(on){
    let avg=.22;
    if(real){
      let sum=0,count=0;
      const lo=3,hi=Math.min(freqData.length-1,48);
      for(let i=lo;i<=hi;i++){sum+=freqData[i];count++}
      avg=(sum/Math.max(1,count))/255
    }else avg=.28+.08*(.5+.5*Math.sin(t/210));
    const pulse=Math.min(1,Math.pow(avg*1.9,.72));
    btn.style.filter=`brightness(${1.02+.16*pulse}) saturate(${1.02+.10*pulse})`;
    btn.style.boxShadow=`0 6px 13px rgba(77,51,7,.20),0 0 ${10+10*pulse}px rgba(255,244,210,.92),0 0 ${22+18*pulse}px rgba(236,199,115,.78),0 0 ${36+26*pulse}px rgba(205,154,57,.38),inset 0 1px 0 rgba(255,255,255,.76),inset 0 -6px 12px rgba(88,53,5,.08)`
  }else{
    btn.style.filter='';btn.style.boxShadow=''
  }

  leftBars.forEach((b,i)=>{
    const e=real?sampledEnergy(i,leftBars.length):on?.18+.16*(.5+.5*Math.sin(t/170+i*.83)):0;
    renderBar(b,e,on)
  });
  rightBars.forEach((b,i)=>{
    const mirror=rightBars.length-1-i;
    const e=real?sampledEnergy(mirror,rightBars.length):on?.18+.16*(.5+.5*Math.sin(t/170+mirror*.83)):0;
    renderBar(b,e,on)
  });
  requestAnimationFrame(animate)
}
requestAnimationFrame(animate);

/* names fit */
(function(){
  const LIMITS={
    recipient:{maxChars:15,maxPx:17,minPx:10},
    sender:{maxChars:15,maxPx:20,minPx:11}
  };
  function fitName(el){
    if(!el)return;
    const spec=el.classList.contains('recipient')?LIMITS.recipient:LIMITS.sender;
    const chars=[...(el.textContent||'').trim()];
    if(chars.length>spec.maxChars)el.textContent=chars.slice(0,spec.maxChars).join('');
    const cs=getComputedStyle(el);
    const available=el.getBoundingClientRect().width;
    if(available<=0)return;
    const m=document.createElement('span');
    m.textContent=el.textContent;
    Object.assign(m.style,{
      position:'fixed',left:'-10000px',top:'-10000px',visibility:'hidden',
      whiteSpace:'nowrap',fontFamily:cs.fontFamily,fontWeight:cs.fontWeight,
      fontStyle:cs.fontStyle,letterSpacing:cs.letterSpacing
    });
    document.body.appendChild(m);
    let low=spec.minPx,high=spec.maxPx,best=low;
    for(let i=0;i<18;i++){
      const size=(low+high)/2;m.style.fontSize=size+'px';
      if(m.getBoundingClientRect().width<=available-8){best=size;low=size}else high=size
    }
    m.remove();el.style.fontSize=best.toFixed(1)+'px'
  }
  const run=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.recipient,.sender').forEach(fitName)));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(run);
  else window.addEventListener('load',run,{once:true});
  window.addEventListener('resize',run);
  document.querySelectorAll('.recipient,.sender').forEach(el=>new MutationObserver(run).observe(el,{childList:true,characterData:true,subtree:true}))
})();
</script>
