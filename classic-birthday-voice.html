<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コエフォト | Classic Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--card-w:min(94vw,540px);--navy:#0b347f;--gold:#c9952f;--gold-soft:#d9b86e;--paper:#fffdf7;--ink:#2d2a25}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f1ea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 42px}
.card{position:relative;width:var(--card-w);aspect-ratio:1060/1484;overflow:hidden;background:var(--paper);border-radius:8px;box-shadow:0 10px 30px rgba(30,35,45,.09);container-type:inline-size}
.photo{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:transparent}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;pointer-events:none}
.recipient,.sender{position:absolute;z-index:4;color:var(--navy);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
.recipient{left:31%;width:43%;top:17.55%;transform:translateY(-100%)}
.sender{left:32%;width:34%;top:84.60%;transform:translateY(-100%)}


.player{position:absolute;z-index:4;left:17.6%;top:67.95%;width:64.0%;height:5.9%;display:grid;grid-template-columns:11.0% 1fr;column-gap:4.3%;align-items:center;padding:0}
.play{width:92%;aspect-ratio:1/1;border:.18cqw solid rgba(201,149,47,.88);border-radius:50%;background:linear-gradient(145deg,#123f8d,#082b69);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:2.35cqw;line-height:1;box-shadow:0 .55cqw 1.5cqw rgba(11,52,127,.20),inset 0 0 0 .32cqw rgba(255,255,255,.08);-webkit-tap-highlight-color:transparent;justify-self:start;align-self:start;transform:translate(-3.15cqw,-.18cqw)}
.play:active{transform:scale(.97)}

/* Player sizing/alignment for Classic Birthday voice page.
   Sized to fill the gold player frame more naturally on iPhone. */
.player{
  left:16.9%;
  top:68.05%;
  width:66.2%;
  height:6.35%;
  grid-template-columns:13.2% 1fr;
  column-gap:3.0%;
  padding:0;
  box-sizing:border-box;
  align-items:center;
}
.play{
  width:112%;
  aspect-ratio:1/1;
  height:auto;
  font-size:2.75cqw;
  justify-self:start;
  align-self:center;
  transform:translate(-1.45cqw,0);
}
.play:active{
  transform:translate(-1.45cqw,0) scale(.97);
}
.player-main{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
}
.wave-wrap{
  position:relative;
  width:100%;
  height:78%;
  display:flex;
  align-items:center;
}
.waveform{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:82%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.24cqw;
  pointer-events:none;
}
.wavebar{
  flex:1 1 0;
  width:auto;
  min-width:.30cqw;
  max-width:.56cqw;
  border-radius:999px;
}

.player-main{min-width:0;height:100%;display:flex;align-items:center}
.wave-wrap{position:relative;width:100%;height:78%;display:flex;align-items:center}
.waveform{
  position:absolute;
  left:0;right:0;
  top:50%;
  height:82%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.24cqw;
  pointer-events:none;
}
.wavebar{
  flex:1 1 0;
  min-width:.30cqw;
  max-width:.56cqw;
  border-radius:999px;
  background:var(--gold-soft);
  opacity:.96;
  transition:background .06s linear;
}
.wavebar.played{background:var(--navy);opacity:1}
.seek{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}


/* ===== Playback effects: clean rebuild ===== */
.play{position:relative}
.play:active{transform:translate(-3.15cqw,-.18cqw) scale(.97)}
.play::before{
  content:"";
  position:absolute;
  inset:-.92cqw;
  border:.20cqw solid rgba(201,149,47,.18);
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  box-shadow:0 0 0 .28cqw rgba(201,149,47,.08),0 0 1.55cqw rgba(201,149,47,.18);
}
.player.is-playing .play::before{animation:koeGoldHalo 1.35s ease-out infinite}
@keyframes koeGoldHalo{
  0%{transform:scale(.90);opacity:.18;border-color:rgba(201,149,47,.28)}
  42%{transform:scale(1.15);opacity:.92;border-color:rgba(244,215,140,.92)}
  100%{transform:scale(1.36);opacity:0;border-color:rgba(201,149,47,0)}
}
.player.is-playing .wavebar{animation:koeWaveShimmer 1.05s ease-in-out infinite alternate}
@keyframes koeWaveShimmer{
  0%{filter:brightness(1) drop-shadow(0 0 .10cqw rgba(244,215,140,.18))}
  100%{filter:brightness(1.38) drop-shadow(0 0 .34cqw rgba(244,215,140,.58))}
}
.player.is-playing .wavebar.played{
  filter:brightness(1.10) drop-shadow(0 0 .22cqw rgba(11,52,127,.28));
}

/* clearly visible floating particles */
.voice-particles{
  position:absolute;z-index:8;left:18%;top:60.3%;width:64%;height:10.5%;
  pointer-events:none;overflow:visible;
}
.voice-particle{
  position:absolute;left:var(--x);bottom:0;width:var(--size);aspect-ratio:1/1;
  border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,242,1) 0 16%,rgba(255,235,164,.98) 30%,rgba(218,165,58,.90) 50%,rgba(201,149,47,.36) 70%,rgba(201,149,47,0) 100%);
  box-shadow:0 0 .40cqw rgba(255,245,205,.95),0 0 1.05cqw rgba(201,149,47,.62);
}
.card.is-playing .voice-particle{animation:koeParticleRise var(--dur) ease-out var(--delay) infinite}
@keyframes koeParticleRise{
  0%{opacity:0;transform:translate3d(0,.7cqw,0) scale(.45)}
  14%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  48%{opacity:.95;transform:translate3d(var(--drift),-3.6cqw,0) scale(1.18)}
  76%{opacity:.58;transform:translate3d(calc(var(--drift) * 1.35),-5.8cqw,0) scale(.90)}
  100%{opacity:0;transform:translate3d(calc(var(--drift) * 1.65),-7.5cqw,0) scale(.55)}
}

/* ① small star twinkles */
.voice-twinkles{
  position:absolute;z-index:9;left:14%;top:61%;width:72%;height:12%;pointer-events:none;
}
.twinkle{
  position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);
  opacity:0;transform:scale(.25) rotate(45deg);
}
.twinkle::before,.twinkle::after{
  content:"";position:absolute;inset:0;margin:auto;
  background:linear-gradient(180deg,#fff8d9,#d5a83f);
  border-radius:999px;box-shadow:0 0 .7cqw rgba(244,215,140,.75);
}
.twinkle::before{width:18%;height:100%}
.twinkle::after{width:100%;height:18%}
.card.is-playing .twinkle{animation:koeTwinkle var(--dur) ease-in-out var(--delay) infinite}
@keyframes koeTwinkle{
  0%,68%,100%{opacity:0;transform:scale(.20) rotate(45deg)}
  76%{opacity:1;transform:scale(1.05) rotate(45deg)}
  84%{opacity:.72;transform:scale(.72) rotate(45deg)}
  91%{opacity:0;transform:scale(.25) rotate(45deg)}
}

/* ③ one-shot celebration on play */
.voice-burst{
  position:absolute;z-index:10;left:50%;top:67%;width:1px;height:1px;pointer-events:none;
}
.burst-dot{
  position:absolute;left:0;top:0;width:var(--size);height:var(--size);
  margin-left:calc(var(--size)/-2);margin-top:calc(var(--size)/-2);
  border-radius:50%;opacity:0;
  background:radial-gradient(circle,#fff9d8 0 22%,#e7bd59 46%,rgba(201,149,47,0) 100%);
  box-shadow:0 0 .70cqw rgba(244,215,140,.78);
}
.voice-burst.fire .burst-dot{animation:koeBurst .92s cubic-bezier(.17,.67,.28,1) var(--delay) 1 both}
@keyframes koeBurst{
  0%{opacity:0;transform:translate(0,0) scale(.35)}
  16%{opacity:1;transform:translate(0,0) scale(1.25)}
  72%{opacity:.92;transform:translate(var(--dx),var(--dy)) scale(.92)}
  100%{opacity:0;transform:translate(calc(var(--dx)*1.22),calc(var(--dy)*1.22)) scale(.45)}
}

@media(prefers-reduced-motion:reduce){
  .player.is-playing .play::before,
  .player.is-playing .wavebar,
  .card.is-playing .voice-particle,
  .card.is-playing .twinkle,
  .voice-burst.fire .burst-dot{animation:none!important}
  .voice-particle,.twinkle,.burst-dot{opacity:0!important}
}

.brand{width:var(--card-w);text-align:center;padding-top:13px;line-height:1.25}
.brand-name{font-size:13px;font-weight:600;letter-spacing:.16em;color:#746b61}
.tagline{margin-top:4px;font-family:Georgia,"Times New Roman",serif;font-size:8px;font-weight:400;letter-spacing:.22em;color:#9a9187}
body.embedded .page{min-height:0;padding-bottom:18px}
@media(max-width:390px){.page{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<main class="page">
<section class="card" aria-label="Classic Birthday ボイスカード">
  <canvas id="photoCanvas" class="photo" width="1060" height="1484" aria-label="贈られた写真"></canvas>
  <img class="art" src="./koefoto_classic_birthday_voice_overlay.png" alt="">
  <div id="recipient" class="recipient"></div>
  
<div class="voice-particles" aria-hidden="true">
  <span class="voice-particle" style="--x:5%;--size:1.20cqw;--dur:2.75s;--delay:-.20s;--drift:-.80cqw"></span>
  <span class="voice-particle" style="--x:21%;--size:.88cqw;--dur:3.20s;--delay:-1.40s;--drift:.55cqw"></span>
  <span class="voice-particle" style="--x:39%;--size:1.05cqw;--dur:2.95s;--delay:-.80s;--drift:-.42cqw"></span>
  <span class="voice-particle" style="--x:57%;--size:1.30cqw;--dur:3.35s;--delay:-2.10s;--drift:.70cqw"></span>
  <span class="voice-particle" style="--x:75%;--size:.92cqw;--dur:2.85s;--delay:-1.05s;--drift:-.60cqw"></span>
  <span class="voice-particle" style="--x:93%;--size:1.10cqw;--dur:3.25s;--delay:-2.55s;--drift:.52cqw"></span>
</div>
<div class="voice-twinkles" aria-hidden="true">
  <span class="twinkle" style="--x:7%;--y:24%;--size:1.75cqw;--dur:3.8s;--delay:-.4s"></span>
  <span class="twinkle" style="--x:31%;--y:2%;--size:1.25cqw;--dur:4.4s;--delay:-2.1s"></span>
  <span class="twinkle" style="--x:68%;--y:8%;--size:1.55cqw;--dur:4.0s;--delay:-1.1s"></span>
  <span class="twinkle" style="--x:91%;--y:30%;--size:1.35cqw;--dur:4.7s;--delay:-3.0s"></span>
</div>
<div id="voiceBurst" class="voice-burst" aria-hidden="true">
  <span class="burst-dot" style="--dx:-7.2cqw;--dy:-3.2cqw;--size:1.05cqw;--delay:0s"></span>
  <span class="burst-dot" style="--dx:-4.9cqw;--dy:-5.4cqw;--size:.82cqw;--delay:.03s"></span>
  <span class="burst-dot" style="--dx:-1.8cqw;--dy:-6.4cqw;--size:1.15cqw;--delay:.06s"></span>
  <span class="burst-dot" style="--dx:2.0cqw;--dy:-6.1cqw;--size:.90cqw;--delay:.02s"></span>
  <span class="burst-dot" style="--dx:5.2cqw;--dy:-4.8cqw;--size:1.12cqw;--delay:.05s"></span>
  <span class="burst-dot" style="--dx:7.4cqw;--dy:-2.4cqw;--size:.84cqw;--delay:.08s"></span>
  <span class="burst-dot" style="--dx:-6.0cqw;--dy:.7cqw;--size:.78cqw;--delay:.07s"></span>
  <span class="burst-dot" style="--dx:6.2cqw;--dy:.8cqw;--size:.96cqw;--delay:.04s"></span>
</div>

<div class="player" aria-label="音声メッセージプレーヤー">
    <button class="play" id="playBtn" type="button" aria-label="再生">▶</button>
    <div class="player-main">
      <div class="wave-wrap">
        <div id="waveform" class="waveform" aria-hidden="true"></div>
        <input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      </div>
      
    </div>
  </div>
  <div id="sender" class="sender"></div>
  <audio id="audio" preload="metadata"></audio>
</section>
<footer class="brand">
  <div class="brand-name">コエフォト</div>
  <div class="tagline">A PHOTO, A VOICE, A MEMORY.</div>
</footer>
</main>
<script>
const $=id=>document.getElementById(id);

if(window.self!==window.top){
  document.body.classList.add('embedded');
  const reportHeight=()=>{
    const page=document.querySelector('.page');
    if(page) parent.postMessage({type:'koefoto-voice-height',height:Math.ceil(page.getBoundingClientRect().height)},location.origin);
  };
  window.addEventListener('load',()=>requestAnimationFrame(reportHeight));
  if('ResizeObserver' in window)new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.querySelector('.page'));
}

function db(){return new Promise((ok,ng)=>{const r=indexedDB.open('koephoto-preview',2);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
async function get(k){const x=await db();const v=await new Promise((ok,ng)=>{const t=x.transaction('draft');const r=t.objectStore('draft').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});x.close();return v}
const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${String(sec).padStart(2,'0')}`};
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
let photoFocusX=.5,photoFocusY=.5,photoZoom=1,redrawPhoto=null;

function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('file_read_failed'));r.readAsDataURL(blob)})}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('image_load_failed'));img.src=src})}

(async()=>{
  let raw='{}';
  try{raw=(parent&&parent.sessionStorage?parent.sessionStorage.getItem('koephoto-draft'):null)||sessionStorage.getItem('koephoto-draft')||'{}'}catch(e){raw=sessionStorage.getItem('koephoto-draft')||'{}'}
  const d=JSON.parse(raw);
  photoFocusX=Number.isFinite(Number(d.photoFocusX))?clamp(Number(d.photoFocusX),0,1):.5;
  photoFocusY=Number.isFinite(Number(d.photoFocusY))?clamp(Number(d.photoFocusY),0,1):.5;
  photoZoom=Number.isFinite(Number(d.photoZoom))?clamp(Number(d.photoZoom),1,2.5):1;
  $('recipient').textContent=[...(d.recipient||'')].slice(0,15).join('');
  $('sender').textContent=[...(d.sender||'')].slice(0,15).join('');

  try{
    const [photo,audioBlob]=await Promise.all([get('photo'),get('audio')]);

    if(photo instanceof Blob && photo.size){
      const img=await loadImage(await blobToDataURL(photo));
      const c=$('photoCanvas'),ctx=c.getContext('2d');

      // メッセージカードと同じ cover → focusX/focusY → zoom ロジック。
      // 枠座標だけ新しいVoice Pageの金枠に合わせる。
      const frame=[{x:40,y:313},{x:997,y:260},{x:1017,y:805},{x:56,y:850}];
      const cx=frame.reduce((s,p)=>s+p.x,0)/4,cy=frame.reduce((s,p)=>s+p.y,0)/4;
      const scale=.973;
      const pts=frame.map(p=>({x:cx+(p.x-cx)*scale,y:cy+(p.y-cy)*scale}));
      const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x));
      const minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
      const fw=maxX-minX,fh=maxY-minY,ir=img.width/img.height,fr=fw/fh;
      let baseSw=img.width,baseSh=img.height;
      if(ir>fr)baseSw=img.height*fr;else baseSh=img.width/fr;

      redrawPhoto=()=>{
        ctx.clearRect(0,0,c.width,c.height);
        const sw=baseSw/photoZoom,sh=baseSh/photoZoom;
        const sx=(img.width-sw)>0.5?(img.width-sw)*photoFocusX:0;
        const sy=(img.height-sh)>0.5?(img.height-sh)*photoFocusY:0;
        ctx.save();ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.lineTo(pts[3].x,pts[3].y);
        ctx.closePath();ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,minX,minY,fw,fh);ctx.restore();
      };
      redrawPhoto();
    }

    if(audioBlob instanceof Blob && audioBlob.size)$('audio').src=URL.createObjectURL(audioBlob);
  }catch(e){console.error(e)}
})();

window.addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.type!=='koefoto-photo-transform'&&e.data.type!=='koefoto-photo-focus')return;
  const x=Number(e.data.x),y=Number(e.data.y),z=Number(e.data.zoom);
  if(Number.isFinite(x))photoFocusX=clamp(x,0,1);
  if(Number.isFinite(y))photoFocusY=clamp(y,0,1);
  if(Number.isFinite(z))photoZoom=clamp(z,1,2.5);
  if(redrawPhoto)redrawPhoto();
});

const audio=$('audio'),btn=$('playBtn'),seek=$('seek'),waveform=$('waveform');
const player=document.querySelector('.player');
const card=document.querySelector('.card');
const voiceBurst=document.getElementById('voiceBurst');

const waveHeights=[9,13,18,12,22,30,17,26,36,21,31,39,24,18,28,34,16,22,31,19,27,36,23,17,29,21,14,10,16,12,8];
waveHeights.forEach(h=>{
  const bar=document.createElement('span');
  bar.className='wavebar';
  bar.dataset.base=String(32+(h/39)*64);
  bar.style.height=Number(bar.dataset.base).toFixed(1)+'%';
  waveform.appendChild(bar);
});
const waveBars=[...waveform.children];

function updateWave(pct){
  const played=Math.round(clamp(pct,0,100)/100*waveBars.length);
  waveBars.forEach((bar,i)=>bar.classList.toggle('played',i<played));
}
function syncSeek(){
  const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;
  seek.value=pct;
  updateWave(pct);
}
let waveRaf=0;
function animateWave(){
  if(audio.paused||audio.ended){waveRaf=0;return}
  const t=audio.currentTime||0;
  waveBars.forEach((bar,i)=>{
    const base=Number(bar.dataset.base)||40;
    const a=Math.sin(t*7.4+i*.73);
    const b=Math.sin(t*4.1+i*1.27);
    const motion=.88+.19*((a+b+2)/4);
    bar.style.height=Math.max(28,Math.min(100,base*motion)).toFixed(1)+'%';
  });
  waveRaf=requestAnimationFrame(animateWave);
}
function startWaveMotion(){if(!waveRaf)waveRaf=requestAnimationFrame(animateWave)}
function resetWaveMotion(){waveBars.forEach(bar=>bar.style.height=Number(bar.dataset.base).toFixed(1)+'%')}

function fireBurst(){
  if(!voiceBurst)return;
  voiceBurst.classList.remove('fire');
  void voiceBurst.offsetWidth;
  voiceBurst.classList.add('fire');
  setTimeout(()=>voiceBurst.classList.remove('fire'),1200);
}

btn.addEventListener('click',async()=>{
  if(!audio.src)return;
  if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}
  else audio.pause();
});
audio.addEventListener('play',()=>{
  btn.textContent='❚❚';
  btn.setAttribute('aria-label','一時停止');
  player.classList.add('is-playing');
  card.classList.add('is-playing');
  startWaveMotion();
  fireBurst();
});
audio.addEventListener('pause',()=>{
  btn.textContent='▶';
  btn.setAttribute('aria-label','再生');
  player.classList.remove('is-playing');
  card.classList.remove('is-playing');
  if(waveRaf){cancelAnimationFrame(waveRaf);waveRaf=0}
  resetWaveMotion();
});
audio.addEventListener('loadedmetadata',syncSeek);
audio.addEventListener('durationchange',syncSeek);
audio.addEventListener('timeupdate',syncSeek);
audio.addEventListener('ended',()=>{
  btn.textContent='▶';
  btn.setAttribute('aria-label','再生');
  player.classList.remove('is-playing');
  card.classList.remove('is-playing');
  if(waveRaf){cancelAnimationFrame(waveRaf);waveRaf=0}
  audio.currentTime=0;
  syncSeek();
  resetWaveMotion();
});
seek.addEventListener('input',()=>{
  if(audio.duration){
    audio.currentTime=(Number(seek.value)/100)*audio.duration;
    syncSeek();
  }
});
audio.addEventListener('seeking',syncSeek);
audio.addEventListener('seeked',syncSeek);

// メッセージカードと同じ名前フィット:
// 15文字、Zen Maru Gothic、Canvas基準14〜40px。
// recipient=455px / sender=310px を現在のカード表示幅へ比例変換。
(function(){
  const LIMITS={recipient:{maxChars:15,maxCanvasPx:40,minCanvasPx:14,maxCanvasWidth:455},sender:{maxChars:15,maxCanvasPx:40,minCanvasPx:14,maxCanvasWidth:310}};
  function fitName(el){
    if(!el)return;
    const spec=el.classList.contains('recipient')?LIMITS.recipient:LIMITS.sender;
    const chars=[...(el.textContent||'').trim()];
    if(chars.length>spec.maxChars)el.textContent=chars.slice(0,spec.maxChars).join('');
    const card=document.querySelector('.card'),cs=getComputedStyle(el);
    if(!card)return;
    const scaleToCss=card.getBoundingClientRect().width/1060;
    const available=spec.maxCanvasWidth*scaleToCss;
    if(available<=0)return;
    const m=document.createElement('span');
    m.textContent=el.textContent;
    Object.assign(m.style,{position:'fixed',left:'-10000px',top:'-10000px',visibility:'hidden',whiteSpace:'nowrap',fontFamily:cs.fontFamily,fontWeight:cs.fontWeight,fontStyle:cs.fontStyle,fontVariant:cs.fontVariant,letterSpacing:cs.letterSpacing});
    document.body.appendChild(m);
    let low=spec.minCanvasPx*scaleToCss,high=spec.maxCanvasPx*scaleToCss,best=low;
    for(let i=0;i<18;i++){const size=(low+high)/2;m.style.fontSize=size+'px';if(m.getBoundingClientRect().width<=available){best=size;low=size}else high=size}
    m.remove();el.style.fontSize=best.toFixed(1)+'px';
  }
  const runFit=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.recipient,.sender').forEach(fitName)));
  if(document.fonts&&document.fonts.ready)Promise.all([document.fonts.load('500 40px "Zen Maru Gothic"'),document.fonts.ready]).then(runFit);else window.addEventListener('load',runFit,{once:true});
  window.addEventListener('resize',runFit);
  document.querySelectorAll('.recipient,.sender').forEach(el=>new MutationObserver(runFit).observe(el,{childList:true,characterData:true,subtree:true}));
})();
</script>
</body>
