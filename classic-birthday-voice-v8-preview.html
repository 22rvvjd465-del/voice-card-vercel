<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday｜コエフォト</title>
<style>
:root{--navy:#123f6d;--gold:#b88b3b;--ivory:#faf6ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5efe6}
.web{min-height:100svh;padding:14px 8px 26px}
.card{position:relative;width:min(600px,100%);aspect-ratio:2/3;margin:auto;overflow:hidden;background:var(--ivory);box-shadow:0 12px 32px #5b493329}
.bg,.decor{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.bg{z-index:1}.decor{z-index:4}

/* Photo: inset from the visible gold frame so no white/blue spill escapes. */
.photo{
  position:absolute;z-index:2;
  left:8.9%;top:24.15%;
  width:80.7%;height:30.35%;
  overflow:hidden;
  clip-path:polygon(0.8% 1.3%,99.0% 0.4%,99.8% 96.6%,1.5% 99.5%);
  background:#eee7dc
}
.photo img{
  width:100%;height:100%;display:block;
  object-fit:cover;
  object-position:50% 50%;
}

/* Use ONLY the fixed-design play icon visually.
   HTML button is a transparent click/tap layer, so no duplicate triangle. */
.play{
  position:absolute;z-index:7;
  left:12.25%;top:65.15%;width:11.2%;aspect-ratio:1;
  border:0;border-radius:50%;background:transparent;
  cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0
}
.play:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Progress overlay only. */
.track{
  position:absolute;z-index:8;
  left:29.45%;top:68.08%;width:38.35%;height:3px;
  border-radius:99px;overflow:hidden;pointer-events:none
}
.fill{width:0;height:100%;background:var(--navy);border-radius:99px}
.time{
  position:absolute;z-index:8;
  left:70.1%;top:66.30%;width:15.2%;height:4%;
  display:flex;align-items:center;justify-content:center;
  background:#fbf8f0;color:#8290a4;
  font-size:clamp(8px,2.1vw,14px);
  font-variant-numeric:tabular-nums;
  pointer-events:none
}

/* Sender baseline aligned just above the existing gold underline. */
.sender{
  position:absolute;z-index:8;
  left:31.0%;top:76.98%;width:46.5%;height:1.75%;
  display:flex;align-items:flex-end;justify-content:center;
  color:#9a763b;font-size:clamp(12px,3.3vw,22px);
  line-height:1;white-space:nowrap;overflow:hidden;
  padding:0 2% 0.05%;
}
audio{display:none}

.brand{width:min(600px,100%);margin:0 auto;text-align:center;padding:17px 8px 0}
.brandname{font-size:15px;font-weight:700;letter-spacing:.08em;color:#173f69}
.tag{margin-top:6px;font:10px Georgia,"Times New Roman",serif;letter-spacing:.18em;color:#9a8c79}
@media(max-width:420px){
  .web{padding:8px 6px 22px}
  .brand{padding-top:14px}
  .brandname{font-size:14px}
  .tag{font-size:9px;letter-spacing:.13em}
}
</style>
</head>
<body>
<main class="web">
<section class="card">
  <img class="bg" src="classic-birthday-voice-v6-bg.png" alt="">
  <div class="photo"><img id="photo" alt=""></div>
  <img class="decor" src="classic-birthday-voice-v6-decor.png" alt="">
  <button class="play" id="play" type="button" aria-label="音声を再生"></button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="time" id="time">0:00 / --:--</div>
  <div class="sender" id="sender"></div>
  <audio id="audio" preload="metadata"></audio>
</section>

<footer class="brand">
  <div class="brandname">コエフォト</div>
  <div class="tag">A PHOTO, A VOICE, A MEMORY.</div>
</footer>
</main>

<script>
function openDB(){return new Promise((ok,ng)=>{
  const r=indexedDB.open("koephoto-preview",2);
  r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error)
})}
async function getBlob(k){
  const x=await openDB();
  const v=await new Promise((ok,ng)=>{
    const t=x.transaction("draft");
    const r=t.objectStore("draft").get(k);
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error)
  });
  x.close(); return v
}
function fmt(s){
  if(!Number.isFinite(s))return"--:--";
  s=Math.max(0,Math.floor(s));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")
}
(async()=>{
  const d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");
  document.getElementById("sender").textContent=d.sender||"";
  const p=await getBlob("photo"), a=await getBlob("audio");
  if(p) document.getElementById("photo").src=URL.createObjectURL(p);
  if(a) document.getElementById("audio").src=URL.createObjectURL(a);
})();

const audio=document.getElementById("audio");
const play=document.getElementById("play");
const fill=document.getElementById("fill");
const time=document.getElementById("time");

function upd(){
  time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%";
}
play.addEventListener("click",async()=>{
  if(audio.paused){
    try{
      await audio.play();
      play.setAttribute("aria-label","音声を一時停止");
    }catch(e){console.error(e)}
  }else{
    audio.pause();
    play.setAttribute("aria-label","音声を再生");
  }
});
audio.addEventListener("loadedmetadata",upd);
audio.addEventListener("durationchange",upd);
audio.addEventListener("timeupdate",upd);
audio.addEventListener("ended",()=>{audio.currentTime=0;upd();play.setAttribute("aria-label","音声を再生")});
</script>
</body>
</html>
