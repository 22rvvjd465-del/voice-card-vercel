/* プレーヤー全体。背景画像には一切手を加えない */
.player{
  position:absolute;
  left:8.3%; right:8.3%;
  top:58.6%; height:15.1%;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:2.2%;
}
.wave{
  position:relative;z-index:10;
  height:55%;display:flex;align-items:center;gap:2.4%;
}
.wave.left{justify-content:flex-end}
.wave.right{justify-content:flex-start}
.bar{
  width:2.4%;min-width:2px;border-radius:99px;
  background:
    linear-gradient(180deg,#fff2c7 0%,var(--gold1) 18%,#e4bd65 52%,var(--gold2) 72%,var(--gold3) 100%);
  box-shadow:
    0 0 4px rgba(255,226,151,.38),
    0 0 10px rgba(223,178,82,.22),
    0 1px 2px rgba(110,73,15,.14);
  transform-origin:center;
  transition:filter .18s ease, box-shadow .18s ease;
}


.sparkles{
  position:absolute;
  inset:-18% -4%;
  pointer-events:none;
  z-index:8;
  overflow:visible;
}
.sparkle{
  position:absolute;
  width:8px;height:8px;
  opacity:0;
  transform:translate(-50%,-50%) scale(.2) rotate(0deg);
  filter:drop-shadow(0 0 5px rgba(255,225,153,.78));
}
.sparkle::before,.sparkle::after{
  content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:linear-gradient(180deg,#fff8dc 0%,#f1d58e 45%,#c89436 100%);
}
.sparkle::before{width:2px;height:100%}
.sparkle::after{width:100%;height:2px}
.sparkle.small{width:5px;height:5px}
.sparkle.large{width:12px;height:12px}
.start-burst .sparkle{
  animation:sparkleBurst var(--dur,1.9s) cubic-bezier(.2,.65,.25,1) var(--delay,0s) 1 both;
}
@keyframes sparkleBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0deg)}
  18%{opacity:.35}
  42%{opacity:1;transform:translate(-50%,-50%) scale(1.45) rotate(45deg)}
  72%{opacity:.48;transform:translate(-50%,-50%) scale(.82) rotate(78deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.28) rotate(105deg)}
}
.ending .disc{animation:endDisc 1.8s ease-out 1}
.ending .play{animation:endButton 1.65s ease-out 1}
.ending .sparkle:nth-child(2n){
  animation:sparkleEnd 1.5s ease-out calc(var(--delay,0s) * .18) 1 both;
}
.ending .sparkle:nth-child(2n+1){
  animation:sparkleEnd 1.85s ease-out calc(var(--delay,0s) * .12) 1 both;
}
@keyframes sparkleEnd{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}
  35%{opacity:.9;transform:translate(-50%,-50%) scale(1.15) rotate(45deg)}
  100%{opacity:0;transform:translate(-50%,-60%) scale(.35) rotate(105deg)}
}
@keyframes endDisc{
  0%{filter:brightness(1)}
  30%{filter:brightness(1.20);box-shadow:0 0 28px rgba(229,190,103,.38),0 8px 17px rgba(5,33,65,.19)}
  100%{filter:brightness(1)}
}
@keyframes endButton{
  0%{transform:translate(-50%,-50%) scale(1)}
  28%{transform:translate(-50%,-50%) scale(1.08)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
.ending .bar{animation:waveFarewell 1.55s ease-out 1}
@keyframes waveFarewell{
  0%{filter:brightness(1.3);opacity:1}
  35%{filter:brightness(1.65);opacity:1}
  100%{filter:brightness(1);opacity:.96}
}
.playing .bar{
  filter:brightness(1.28) saturate(1.12);
  box-shadow:
    0 0 5px rgba(255,239,190,.82),
    0 0 12px rgba(233,190,96,.72),
    0 0 22px rgba(205,151,47,.30);
}
.playing .disc{
  box-shadow:
    0 8px 17px rgba(5,33,65,.19),
    0 0 16px rgba(220,179,88,.14),
    inset 0 0 0 6px rgba(255,255,255,.015);
}
.playing .play{
  box-shadow:
    0 6px 13px rgba(77,51,7,.22),
    0 0 11px rgba(255,225,157,.72),
    0 0 26px rgba(204,151,50,.28),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -6px 12px rgba(88,53,5,.10);
}

.core{
  position:relative;z-index:11;
  width:clamp(108px,27.5vw,146px);
  aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
}
.ripple{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(205,163,77,.34);
  opacity:0;pointer-events:none;
}
.start-burst .r1{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) 0s 1}
.start-burst .r2{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) .18s 1}
.start-burst .r3{animation:rippleStart 1.55s cubic-bezier(.15,.65,.25,1) .36s 1}
@keyframes rippleStart{
  0%{transform:scale(.86);opacity:0}
  12%{opacity:.82}
  60%{opacity:.28}
  100%{transform:scale(1.55);opacity:0}
}

.disc{
  position:absolute;inset:7%;border-radius:50%;
  background:
    radial-gradient(circle at 36% 25%,rgba(255,255,255,.12),transparent 25%),
    radial-gradient(circle at 50% 40%,#124d89 0%,var(--navy) 45%,var(--navy2) 100%);
  border:1.5px solid #d4ad5c;
  box-shadow:
    0 8px 17px rgba(5,33,65,.19),
    inset 0 0 0 6px rgba(255,255,255,.015);
}
.disc:before{
  content:"";position:absolute;inset:10%;border-radius:50%;
  border:1px solid rgba(238,207,137,.60);
}
.disc:after{
  content:"";position:absolute;inset:-7%;border-radius:50%;
  border:1px solid rgba(205,163,77,.17);
}

.play{
  position:absolute;z-index:4;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:50%;aspect-ratio:1;border:0;border-radius:50%;padding:0;
  display:grid;place-items:center;cursor:pointer;
  background:
    radial-gradient(circle at 34% 25%,#f7e5b0 0%,#e0bd6d 24%,#c99940 60%,#a67220 100%);
  box-shadow:
    0 6px 13px rgba(77,51,7,.22),
    inset 0 1px 0 rgba(255,255,255,.58),
    inset 0 -6px 12px rgba(88,53,5,.10);
  -webkit-tap-highlight-color:transparent;
}
.play:active{transform:translate(-50%,-50%) scale(.94)}
.play svg{
  width:76%;height:76%;fill:#fffdf7;
  transform:translateX(4%);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));
}
.time{
  position:absolute;z-index:5;left:50%;bottom:16%;
  transform:translateX(-50%);white-space:nowrap;
  color:#fff;font-size:clamp(9px,2.1vw,12px);
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}

.test{text-align:center;padding:14px 12px 0}
.test p{margin:0 0 10px;font-size:12px;color:#68635c}
.test label{
  display:inline-block;padding:10px 17px;border:1px solid #aaa39a;
  border-radius:999px;background:#fff;font-size:12px
}
.test input{display:none}

@media(max-width:390px){
  .player{left:8%;right:8%;top:58.5%;gap:1.8%}
  .wave{gap:2.1%}
  .core{width:27.5vw}
}
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="player" id="player">
      <div class="sparkles" id="sparkles" aria-hidden="true"></div>
      <div class="wave left" id="waveL"></div>
      <div class="core">
        <span class="ripple r1"></span><span class="ripple r2"></span><span class="ripple r3"></span>
        <div class="disc"></div>
        <button class="play" id="playBtn" type="button" aria-label="音声を再生">
          <svg id="icon" viewBox="0 0 24 24"><path d="M8 5.2v13.6L18.4 12z"/></svg>
        </button>
      </div>
      <div class="wave right" id="waveR"></div>
    </div>
  </div>
  <div class="test">
    <p>確認用：音声を選ぶと再生できます。</p>
    <label>音声を選ぶ<input id="audioFile" type="file" accept="audio/*,.m4a,.mp4,.aac,.wav,.mp3,.caf"></label>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const heights=[10,14,20,30,45,66,83,62,45,31,22,16,20,29,42,59,76,58,41,28,19,13];
function makeWave(el,rev=false){
  const a=rev?[...heights].reverse():heights;
  a.forEach((h,i)=>{
    const b=document.createElement('span');b.className='bar';
    b.style.height=h+'%';b.dataset.base=h;b.dataset.i=i;el.appendChild(b);
  });
}
makeWave(document.getElementById('waveL'));
makeWave(document.getElementById('waveR'),true);

// 再生中だけ現れるシャンパンゴールドの光。背景画像は変更せずHTML/CSSのみ。
const sparkleLayer=document.getElementById('sparkles');
[
  [7,28,'small',0.10,1.65],[16,63,'',0.55,2.05],[25,18,'large',1.05,2.45],
  [35,76,'small',1.35,1.80],[47,12,'',0.35,2.20],[58,78,'large',0.85,2.70],
  [69,20,'small',1.50,1.95],[80,66,'',0.20,2.35],[92,32,'large',1.15,2.55],
  [13,42,'',1.70,2.10],[88,49,'small',0.70,1.75]
].forEach(([x,y,size,delay,dur])=>{
  const sp=document.createElement('span');
  sp.className='sparkle '+size;
  sp.style.left=x+'%';
  sp.style.top=y+'%';
  sp.style.setProperty('--delay',delay+'s');
  sp.style.setProperty('--dur',dur+'s');
  sparkleLayer.appendChild(sp);
});

const audio=document.getElementById('audio'), file=document.getElementById('audioFile');
const player=document.getElementById('player'), btn=document.getElementById('playBtn');
const icon=document.getElementById('icon');

function fmt(x){
  if(!Number.isFinite(x))return '0:00';
  return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
}
function setIcon(on){
  icon.innerHTML=on?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>':'<path d="M8 5.2v13.6L18.4 12z"/>';
}
let audioCtx=null, analyser=null, mediaSource=null, freqData=null;
let startFxTimer=0, endFxTimer=0;

async function ensureAudioAnalysis(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  try{
    if(!audioCtx){
      audioCtx=new AC();
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=.78;
      freqData=new Uint8Array(analyser.frequencyBinCount);
      mediaSource=audioCtx.createMediaElementSource(audio);
      mediaSource.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')await audioCtx.resume();
    return true;
  }catch(err){
    console.warn('Web Audio analyser unavailable; using fallback animation.',err);
    return false;
  }
}

function replayClass(name,duration){
  player.classList.remove(name);
  void player.offsetWidth;
  player.classList.add(name);
  const id=setTimeout(()=>player.classList.remove(name),duration);
  if(name==='start-burst'){clearTimeout(startFxTimer);startFxTimer=id}
  if(name==='ending'){clearTimeout(endFxTimer);endFxTimer=id}
}

btn.onclick=async()=>{
  if(!audio.src)return;
  if(audio.paused){
    try{
      await ensureAudioAnalysis();
      await audio.play();
    }catch(e){console.error(e)}
  }else{
    audio.pause();
  }
};
audio.onplay=()=>{
  player.classList.remove('ending');
  player.classList.add('playing');
  replayClass('start-burst',2300);
  setIcon(true);
};
audio.onpause=()=>{
  if(!audio.ended)player.classList.remove('playing');
  setIcon(false);
};
audio.onended=()=>{
  player.classList.remove('playing','start-burst');
  replayClass('ending',2200);
  setIcon(false);
};

let currentAudioURL='';
file.onchange=async()=>{
  const f=file.files?.[0];if(!f)return;
  try{
    if(currentAudioURL){URL.revokeObjectURL(currentAudioURL);currentAudioURL='';}

    // iPhoneのボイスメモ/ファイル選択でSafariがFileを直接扱えないケースを避ける。
    const buffer=await f.arrayBuffer();
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    let type=f.type||'';
    if(!type){
      if(ext==='m4a'||ext==='mp4') type='audio/mp4';
      else if(ext==='aac') type='audio/aac';
      else if(ext==='wav') type='audio/wav';
      else if(ext==='mp3') type='audio/mpeg';
      else if(ext==='caf') type='audio/x-caf';
      else type='application/octet-stream';
    }
    const blob=new Blob([buffer],{type});
    currentAudioURL=URL.createObjectURL(blob);
    audio.src=currentAudioURL;
    player.classList.remove('playing','start-burst','ending');
    setIcon(false);
    audio.load();

    // Safariでmetadata取得が遅い場合にも明示的に読み込みを促す。
    await new Promise((resolve,reject)=>{
      if(audio.readyState>=1) return resolve();
      const ok=()=>{cleanup();resolve()};
      const ng=()=>{cleanup();reject(new Error('audio-load-error'))};
      const cleanup=()=>{
        audio.removeEventListener('loadedmetadata',ok);
        audio.removeEventListener('error',ng);
      };
      audio.addEventListener('loadedmetadata',ok,{once:true});
      audio.addEventListener('error',ng,{once:true});
      setTimeout(()=>{cleanup();resolve()},5000);
    });
  }catch(err){
    console.error(err);
    alert('音声を読み込めませんでした。iPhoneの「ファイル」に保存してから、もう一度選択してください。');
  }
};

const leftBars=[...document.querySelectorAll('#waveL .bar')];
const rightBars=[...document.querySelectorAll('#waveR .bar')];

function sampledEnergy(i,total){
  if(!analyser||!freqData)return 0;
  const minBin=2,maxBin=Math.min(freqData.length-1,54);
  const pos=i/Math.max(1,total-1);
  const center=Math.round(minBin+(maxBin-minBin)*pos);
  let sum=0,count=0;
  for(let k=-2;k<=2;k++){
    const idx=Math.max(minBin,Math.min(maxBin,center+k));
    sum+=freqData[idx];count++;
  }
  return (sum/count)/255;
}

function renderBar(b,energy,on){
  const base=+b.dataset.base;
  const response=on?Math.min(1,Math.pow(energy*1.9,.72)):0;
  const h=on?Math.max(13,base*(.62+1.08*response)):base;
  const glow=on?8+26*response:8;
  b.style.height=h+'%';
  b.style.opacity=on?(.78+.22*response):.96;
  b.style.boxShadow=on
    ?`0 0 5px rgba(255,244,205,.95),0 0 ${glow}px rgba(232,187,91,.82),0 0 ${glow+13}px rgba(198,145,42,.32)`
    :'0 0 4px rgba(255,226,151,.38),0 0 10px rgba(223,178,82,.22),0 1px 2px rgba(110,73,15,.14)';
}

function animate(t){
  const on=!audio.paused&&!audio.ended;
  const real=on&&analyser&&freqData&&audioCtx&&audioCtx.state==='running';
  if(real)analyser.getByteFrequencyData(freqData);

  leftBars.forEach((b,i)=>{
    const e=real?sampledEnergy(i,leftBars.length):on?.18+.16*(.5+.5*Math.sin(t/170+i*.83)):0;
    renderBar(b,e,on);
  });
  rightBars.forEach((b,i)=>{
    const mirror=rightBars.length-1-i;
    const e=real?sampledEnergy(mirror,rightBars.length):on?.18+.16*(.5+.5*Math.sin(t/170+mirror*.83)):0;
    renderBar(b,e,on);
  });
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
