<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classic Birthday｜コエフォト</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5efe6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.page{padding:10px 6px 30px}
.card{position:relative;width:min(620px,100%);aspect-ratio:1024/1536;margin:auto;background:#fbf8f1;overflow:hidden;box-shadow:0 12px 30px #5b493326}

/* Photo goes behind the approved design artwork.
   This makes the top-right flower/ribbon and lower-left hearts frontmost. */
.photo{
 position:absolute;z-index:1;
 left:7.6%; top:21.9%; width:84.9%; height:33.7%;
 overflow:hidden;background:#eee9df;
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}

.design{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}

/* Dynamic recipient and sender fields */
.toName{
 position:absolute;z-index:3;left:18.5%;right:29%;top:16.65%;
 text-align:center;color:#9a763b;font-size:clamp(13px,3.1vw,21px);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.sender{
 position:absolute;z-index:3;left:25%;right:21%;top:79.25%;
 text-align:center;color:#9a763b;font-size:clamp(13px,3.1vw,21px);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* Functional audio control overlays the illustrated player */
.playerHit{
 position:absolute;z-index:4;left:13.1%;right:12.3%;top:65.7%;height:7.5%;
 display:flex;align-items:center
}
.play{
 width:12.5%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer
}
.trackHit{position:relative;flex:1;height:100%;margin-left:2%}
.progress{
 position:absolute;left:3%;right:27%;bottom:21%;height:4px;border-radius:9px;background:transparent;overflow:hidden
}
.progressFill{height:100%;width:0;background:#0a4c86;opacity:.65}
.time{
 position:absolute;right:8%;bottom:10%;font-size:clamp(8px,1.8vw,12px);
 color:#0b3973;background:#fbf8f1e6;padding:1px 3px;border-radius:4px
}
.brand{text-align:center;padding:18px 8px 0;color:#173f69;font-weight:700;letter-spacing:.08em}
.tag{margin-top:6px;color:#9a8c79;font:10px Georgia,serif;letter-spacing:.18em;font-weight:400}
audio{display:none}
</style>
</head>
<body>
<main class="page">
<section class="card">
  <div class="photo"><img id="photo" alt=""></div>
  <img class="design" src="voice-card-design.png" alt="">
  <div id="toName" class="toName"></div>
  <div id="sender" class="sender"></div>

  <div class="playerHit">
    <button id="play" class="play" aria-label="音声を再生・一時停止"></button>
    <div class="trackHit">
      <div class="progress"><div id="fill" class="progressFill"></div></div>
      <div id="time" class="time">0:00 / --:--</div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
</section>
<div class="brand">コエフォト<div class="tag">A PHOTO, A VOICE, A MEMORY.</div></div>
</main>

<script>
function openDB(){
 return new Promise((ok,ng)=>{
  const r=indexedDB.open("koephoto-preview",2);
  r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);
 });
}
async function getBlob(key){
 try{
  const db=await openDB();
  const v=await new Promise((ok,ng)=>{
   const t=db.transaction("draft"),r=t.objectStore("draft").get(key);
   r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);
  });
  db.close(); return v;
 }catch(e){ return null; }
}
function fmt(s){
 if(!Number.isFinite(s)) return "--:--";
 s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
(async()=>{
 const d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");
 toName.textContent=d.recipient||"";
 sender.textContent=d.sender||"";
 const p=await getBlob("photo"), a=await getBlob("audio");
 if(p) photo.src=URL.createObjectURL(p);
 if(a) audio.src=URL.createObjectURL(a);
})();
play.onclick=async()=>{ audio.paused ? await audio.play() : audio.pause(); };
function update(){
 time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
 fill.style.width=(audio.duration ? audio.currentTime/audio.duration*100 : 0)+"%";
}
audio.onloadedmetadata=update; audio.ontimeupdate=update;
audio.onended=()=>{audio.currentTime=0;update();}
</script>
</body>
</html>
