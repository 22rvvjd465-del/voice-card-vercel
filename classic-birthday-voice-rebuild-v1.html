<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classic Birthday｜コエフォト</title>
<style>
:root{
  --navy:#0d477b;
  --gold:#bf933d;
  --ivory:#fbf7ef;
  --muted:#8c8378;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f4eee5;color:#25364a
}
.web{min-height:100svh;padding:12px 8px 28px}
.card{
  position:relative;
  width:min(620px,100%);
  aspect-ratio:1060/1484;
  margin:0 auto;
  overflow:hidden;
  background:var(--ivory);
  border:1px solid rgba(191,147,61,.55);
  box-shadow:0 14px 34px rgba(71,53,30,.15)
}
.inner-border{
  position:absolute;inset:1.9%;
  border:1px solid rgba(191,147,61,.7);
  pointer-events:none
}
.header{
  position:absolute;left:5.5%;right:5.5%;top:4.2%;height:16%;
}
.title{
  font-family:"Snell Roundhand","Brush Script MT","Segoe Script",cursive;
  font-size:clamp(36px,8.9vw,67px);
  line-height:.95;
  white-space:nowrap;
  letter-spacing:-.045em;
}
.title .navy{color:var(--navy)}
.title .gold{color:var(--gold);margin-left:.035em}
.subtitle{
  margin-top:2.2%;
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.22em;
  color:#747b83;
  font-size:clamp(8px,2vw,13px)
}
.top-heart{
  position:absolute;left:7.8%;top:3.5%;
  color:var(--gold);font-size:clamp(24px,5.5vw,40px);
  transform:rotate(-8deg)
}
.flower{
  position:absolute;z-index:10;
  right:3.0%;top:7.0%;width:22.8%;height:auto;
  pointer-events:none
}

/* One shared geometry defines BOTH the gold frame and the user photo.
   This removes the accumulated angle/position drift from earlier versions. */
.photo-shell{
  position:absolute;z-index:2;
  left:6.2%;top:22.5%;width:87.8%;height:39.0%;
  background:var(--gold);
  clip-path:polygon(0% 4.2%,98.3% 0%,100% 95.4%,1.8% 100%);
}
.photo{
  position:absolute;
  inset:0.55%;
  overflow:hidden;
  background:#ece7df;
  clip-path:polygon(0% 4.2%,98.3% 0%,100% 95.4%,1.8% 100%);
}
.photo img{
  width:100%;height:100%;display:block;
  object-fit:cover;object-position:50% 50%
}
.hearts{
  position:absolute;z-index:8;
  left:2.6%;top:50.0%;width:14.4%;height:auto;
  pointer-events:none
}
.voice-label{
  position:absolute;left:0;right:0;top:63.5%;
  text-align:center;color:var(--navy);
  font-size:clamp(15px,3.5vw,23px);font-weight:700;
}
.voice-label .mic{font-size:1.15em;margin-right:.35em}
.player{
  position:absolute;left:9.2%;right:9.2%;top:69.0%;height:7.3%;
  border-radius:18px;background:rgba(255,255,255,.72);
  box-shadow:0 6px 20px rgba(48,39,25,.08);
  display:flex;align-items:center;padding:0 5.2% 0 2.8%;
  gap:4.5%
}
.play{
  width:14.5%;aspect-ratio:1;border:0;border-radius:50%;
  background:var(--navy);display:grid;place-items:center;padding:0;
  flex:0 0 auto
}
.playIcon{
  width:0;height:0;margin-left:8%;
  border-top:.85em solid transparent;
  border-bottom:.85em solid transparent;
  border-left:1.22em solid #fff
}
.play.playing .playIcon{
  width:1.05em;height:1.42em;margin-left:0;border:0;
  background:linear-gradient(to right,#fff 0 34%,transparent 34% 66%,#fff 66% 100%)
}
.progress-wrap{flex:1;height:28px;display:flex;align-items:center;gap:9px}
.bar{position:relative;height:5px;flex:1;border-radius:99px;background:#d7dde2;overflow:hidden}
.fill{height:100%;width:0;background:var(--navy);border-radius:99px}
.time{font-size:clamp(8px,2.1vw,13px);color:#8190a4;font-variant-numeric:tabular-nums;white-space:nowrap}
.from{
  position:absolute;left:16%;right:16%;top:80.1%;height:5.6%;
  display:grid;grid-template-columns:auto 1fr;align-items:end;gap:3.2%;
}
.from-label{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--navy);letter-spacing:.16em;
  font-weight:700;font-size:clamp(11px,2.7vw,17px);
  padding-bottom:4px
}
.sender-line{position:relative;height:100%;border-bottom:1.5px solid var(--gold)}
.sender{
  position:absolute;left:0;right:0;bottom:4px;text-align:center;
  color:#9a763b;font-size:clamp(13px,3.2vw,21px);
  white-space:nowrap;overflow:hidden
}
.small-heart{
  position:absolute;right:10.5%;top:79.4%;color:var(--gold);
  font-size:clamp(22px,5vw,36px)
}
.waves{
  position:absolute;left:-5%;right:-5%;bottom:-2%;height:16%;overflow:hidden
}
.wave1,.wave2,.wave3{position:absolute;border-radius:50% 50% 0 0 / 65% 65% 0 0}
.wave1{left:-8%;bottom:-35%;width:78%;height:120%;background:var(--navy);transform:rotate(7deg)}
.wave2{right:-8%;bottom:-48%;width:76%;height:118%;background:var(--gold);transform:rotate(-7deg)}
.wave3{left:28%;bottom:-50%;width:88%;height:112%;background:var(--navy);transform:rotate(-3deg)}
.gold-line{
  position:absolute;left:-4%;right:-4%;bottom:10.6%;height:1.5px;background:var(--gold);
  transform:rotate(-2deg)
}
.heart-line{
  position:absolute;right:7.5%;bottom:8.8%;
  color:var(--gold);font-size:clamp(24px,6vw,42px)
}
.brand{
  width:min(620px,100%);margin:0 auto;text-align:center;padding:18px 10px 0
}
.brandname{font-size:15px;font-weight:700;letter-spacing:.08em;color:#173f69}
.tag{
  margin-top:6px;font:10px Georgia,"Times New Roman",serif;
  letter-spacing:.18em;color:#9a8c79
}
audio{display:none}
@media(max-width:420px){
  .web{padding:8px 6px 22px}
  .brand{padding-top:14px}.brandname{font-size:14px}
  .tag{font-size:9px;letter-spacing:.13em}
}
</style>
</head>
<body>
<main class="web">
  <section class="card" aria-label="Classic Birthday ボイスページ">
    <div class="inner-border"></div>
    <div class="top-heart">♥</div>

    <header class="header">
      <div class="title"><span class="navy">Happy</span><span class="gold"> Birthday</span></div>
      <div class="subtitle">A SPECIAL VOICE MESSAGE FOR YOU</div>
    </header>

    <img class="flower" src="classic-birthday-flower-exact.png" alt="">

    <div class="photo-shell">
      <div class="photo"><img id="photo" alt=""></div>
    </div>

    <img class="hearts" src="classic-birthday-hearts-exact.png" alt="">

    <div class="voice-label"><span class="mic">🎙</span>声を聞いてね♪</div>

    <div class="player">
      <button class="play" id="play" type="button" aria-label="音声を再生">
        <span class="playIcon"></span>
      </button>
      <div class="progress-wrap">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="time" id="time">0:00 / --:--</div>
      </div>
    </div>

    <div class="from">
      <div class="from-label">FROM</div>
      <div class="sender-line"><div class="sender" id="sender"></div></div>
    </div>
    <div class="small-heart">♥</div>

    <div class="waves">
      <div class="wave1"></div><div class="wave2"></div><div class="wave3"></div>
    </div>
    <div class="gold-line"></div>
    <div class="heart-line">♡</div>

    <audio id="audio" preload="metadata"></audio>
  </section>

  <footer class="brand">
    <div class="brandname">コエフォト</div>
    <div class="tag">A PHOTO, A VOICE, A MEMORY.</div>
  </footer>
</main>

<script>
function openDB(){return new Promise((ok,ng)=>{
  const r=indexedDB.open("koephoto-preview",2);
  r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)
})}
async function getBlob(k){
  const x=await openDB();
  const v=await new Promise((ok,ng)=>{
    const t=x.transaction("draft");
    const r=t.objectStore("draft").get(k);
    r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)
  });
  x.close();return v
}
function fmt(s){
  if(!Number.isFinite(s))return"--:--";
  s=Math.max(0,Math.floor(s));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")
}
(async()=>{
  const d=JSON.parse(sessionStorage.getItem("koephoto-draft")||"{}");
  document.getElementById("sender").textContent=d.sender||"";
  const p=await getBlob("photo"),a=await getBlob("audio");
  if(p)document.getElementById("photo").src=URL.createObjectURL(p);
  if(a)document.getElementById("audio").src=URL.createObjectURL(a);
})();
const audio=document.getElementById("audio");
const play=document.getElementById("play");
const fill=document.getElementById("fill");
const time=document.getElementById("time");
function upd(){
  time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%";
}
play.addEventListener("click",async()=>{
  if(audio.paused){try{await audio.play()}catch(e){console.error(e)}}else audio.pause();
});
audio.addEventListener("play",()=>{play.classList.add("playing");play.setAttribute("aria-label","音声を一時停止")});
audio.addEventListener("pause",()=>{play.classList.remove("playing");play.setAttribute("aria-label","音声を再生")});
audio.addEventListener("loadedmetadata",upd);
audio.addEventListener("durationchange",upd);
audio.addEventListener("timeupdate",upd);
audio.addEventListener("ended",()=>{audio.currentTime=0;upd()});
</script>
</body>
</html>
